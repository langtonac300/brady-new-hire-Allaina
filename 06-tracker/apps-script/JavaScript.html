    function updatePalette(query) {
      state.palette.query = query;
      var needle = query.toLowerCase().trim();
      var all = paletteItems();
      var hits = needle
        ? all.filter(function (i) {
            return (i.label + ' ' + (i.hint || '')).toLowerCase().indexOf(needle) !== -1;
          })
        : all.slice(0, 12);
      state.palette.results = hits.slice(0, 40);
      state.palette.cursor = 0;
      drawPalette();
    }

    function drawPalette() {
      var list = el('paletteHits');
      if (!list) return;
      if (!state.palette.results.length) {
        list.innerHTML = '<li><div style="padding:14px 22px;color:var(--ink-3)">Nothing matches.</div></li>';
        return;
      }
      list.innerHTML = state.palette.results.map(function (item, i) {
        return '<li><button data-pal="' + i + '" class="' + (i === state.palette.cursor ? 'active' : '') + '">' +
          '<span class="t">' + esc(item.label) + '</span>' +
          '<span class="s">' + esc(item.kind) + (item.hint ? ' &middot; ' + esc(item.hint).slice(0, 90) : '') + '</span>' +
          '</button></li>';
      }).join('');

    /* ============================== 1:1 prep ============================== */

    /**
     * The 1:1 is analyst-led - she brings the agenda and Alex does not prepare one. That
     * makes assembling it from what she has already written the single most useful thing
     * this app can do for her once a week.
     */
    function oneOnOnePrep() {
      var d = state.data;
      var lines = [];

      var inFlight = d.projects.filter(function (p) {
        return p.Status === 'In progress' || p.Status === 'Ready for readout' || p.Status === 'Blocked';
      });
      var doneRecently = d.projects.filter(function (p) { return p.Status === 'Done' && p.Finished; })
        .sort(function (a, b) { return String(b.Finished).localeCompare(String(a.Finished)); })
        .slice(0, 4);
      var openQ = d.questions.filter(function (q) { return q.Status === 'Open'; });
      var recentWrong = d.wrong.slice(-4).reverse();
      var followUps = d.notes.filter(function (n) { return n['Follow-up'] && n.Done !== 'Yes'; });
      var blockedAccess = d.systems.filter(function (s) { return s.Status === 'Requested' || s.Status === 'Blocked'; });

      lines.push('1:1 agenda' + (d.position.started ? ' - day ' + d.position.day : ''));
      lines.push('');

      if (doneRecently.length) {
        lines.push('Finished since we last spoke');
        doneRecently.forEach(function (p) {
          lines.push('  - ' + p.ID + ' ' + p.Project + (p.Finished ? ' (' + p.Finished + ')' : '') +
            (p['Timebox held'] && p['Timebox held'] !== 'Held' ? ' - timebox ' + p['Timebox held'].toLowerCase() : ''));
        });
        lines.push('');
      }

      if (inFlight.length) {
        lines.push('In flight');
        inFlight.forEach(function (p) {
          lines.push('  - ' + p.ID + ' ' + p.Project + ' - ' + p.Status);
          if (p.Notes) lines.push('      ' + p.Notes.replace(/\n/g, ' '));
        });
        lines.push('');
      }

      if (recentWrong.length) {
        lines.push('What I got wrong, and the habit behind it');
        recentWrong.forEach(function (w) {
          lines.push('  - ' + (w.Project ? w.Project + ': ' : '') + (w['Habit to watch'] || w['Why I was off'] || w['What actually happened']));
        });
        lines.push('');
      }

      if (openQ.length) {
        lines.push('Questions I have not been able to answer');
        openQ.slice(0, 8).forEach(function (q) {
          lines.push('  - ' + q.Question.replace(/\n/g, ' ') + (q.Project ? ' (' + q.Project + ')' : ''));
        });
        if (openQ.length > 8) lines.push('  - ...and ' + (openQ.length - 8) + ' more');
        lines.push('');
      }

      if (followUps.length) {
        lines.push('Follow-ups I owe');
        followUps.forEach(function (n) {
          lines.push('  - ' + n['Follow-up'] + (n.Who ? ' (' + n.Who + ')' : ''));
        });
        lines.push('');
      }

      if (blockedAccess.length) {
        lines.push('Access still outstanding');
        blockedAccess.forEach(function (s) {
          lines.push('  - ' + s.Tool + ' - ' + s.Status.toLowerCase() +
            (s.Requested ? ', asked ' + s.Requested : '') + ' (' + s['Access by'] + ')');
        });
        lines.push('');
      }

      lines.push('What I want to be better at');
      lines.push('  - ');

      return lines.join('\n');
    }

    function showOneOnOne() {
      var text = oneOnOnePrep();
      openModal({
        title: 'Your 1:1 agenda',
        wide: true,
        body:
          '<p class="lede" style="margin-bottom:14px">Assembled from what you have already written. ' +
          'The 1:1 is yours to run - this is a starting point, not the whole thing. Blockers should have ' +
          'gone to chat on the day rather than waiting for this.</p>' +
          '<pre class="copyable">' + esc(text) + '</pre>',
        footer: '<button class="btn" data-copy-oneonone>Copy it</button>' +
          '<button class="btn quiet" data-close>Close</button>'
      });
    }

    /* ============================== readout ============================== */

    /** The three-part readout: what I found, what I was wrong about, what I would do next.
     *  The middle part is the one people leave out and the one worth hearing. */
    function readoutFor(id) {
      var p = projectById(id);
      if (!p) return '';
      var wrong = state.data.wrong.filter(function (w) { return w.Project === id; });

      var lines = [
        p.ID + ' - ' + p.Project,
        p.Account + ' - ' + p['Time box'] + (p.Hours ? ' - ' + p.Hours + 'h actual' : ''),
        '',
        'What I found',
        '  ',
        '',
        'What I was wrong about'
      ];

      if (p.Prediction) {
        lines.push('  I predicted: ' + p.Prediction.replace(/\n/g, ' '));
      }
      if (wrong.length) {
        wrong.forEach(function (w) {
          if (w['What actually happened']) lines.push('  Actually: ' + w['What actually happened'].replace(/\n/g, ' '));
          if (w['Why I was off']) lines.push('  Why: ' + w['Why I was off'].replace(/\n/g, ' '));
          if (w['Habit to watch']) lines.push('  The habit: ' + w['Habit to watch'].replace(/\n/g, ' '));
        });
      } else {
        lines.push('  ');
      }

      lines.push('');
      lines.push('What I would do next');
      lines.push('  ');
      lines.push('');
      lines.push('Did the timebox hold?');
      lines.push('  ' + (p['Timebox held'] || '') +
        (p['Timebox held'] === 'Ran over' || p['Timebox held'] === 'Came in under'
          ? ' - worth saying so, the ladder gets fixed with that feedback'
          : ''));

      return lines.join('\n');
    }

    function showReadout(id) {
      var text = readoutFor(id);
      openModal({
        title: 'Readout - ' + id,
        wide: true,
        body:
          '<p class="lede" style="margin-bottom:14px">Three parts, ten minutes. The conclusion first, not ' +
          'the method - nobody needs the walkthrough. Your prediction and anything you logged as wrong are ' +
          'already filled in.</p>' +
          '<pre class="copyable">' + esc(text) + '</pre>',
        footer: '<button class="btn" data-copy-readout="' + esc(id) + '">Copy it</button>' +
          '<button class="btn quiet" data-close>Close</button>'
      });
    }

    /* ============================== events ============================== */

    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;

      // Resolved before the dropdown is closed: closing redraws the bar, and a chip that has
      // been clicked is easier to read off the event than off the DOM that replaced it.
      var trailBtn = t.closest('[data-trail]');
      if (state.trailOpen && !t.closest('.hwrap')) closeTrailMenu();

      if (trailBtn) {
        jumpTo(trail[Number(trailBtn.getAttribute('data-trail'))]);
        return;
      }

      var resumeBtn = t.closest('[data-resume]');
      if (resumeBtn) {
        var resumeId = resumeBtn.getAttribute('data-resume');
        var stop = null;
        for (var ri = 0; ri < trail.length; ri++) {
          if (trail[ri].doc === resumeId) {
            stop = trail[ri];
            break;
          }
        }
        jumpTo(stop || { doc: resumeId, scroll: 0 });
        return;
      }

      var dismissBtn = t.closest('[data-resume-off]');
      if (dismissBtn) {
        // Per document and per session: dismissing this one is not a vote against the feature.
        writeStore('session', 'ramp.resume.' + dismissBtn.getAttribute('data-resume-off'), 'off');
        renderResume();
        return;
      }

      if (t.closest('[data-scrim]') === t || t.closest('[data-close]')) {
        closeModal();
        return;
      }

      var pal = t.closest('[data-pal]');
      if (pal) {
        var item = state.palette.results[Number(pal.getAttribute('data-pal'))];
        if (item) item.run();
        return;
      }

      var navBtn = t.closest('[data-view]');
      if (navBtn) {
        closeModal();
        state.view = navBtn.getAttribute('data-view');
        render();
        return;
      }

      var goProj = t.closest('[data-goto-project]');
      if (goProj) {
        gotoProject(goProj.getAttribute('data-goto-project'));
        return;
      }

      var globalNavBtn = t.closest('[data-app]');
      if (globalNavBtn) {
        e.preventDefault();
        var appId = globalNavBtn.getAttribute('data-app');
        
        // Update active class on nav
        document.querySelectorAll('.global-nav-item').forEach(function(el) {
          el.classList.remove('active');
        });
        globalNavBtn.classList.add('active');

        // Hide all apps, show target app
        document.querySelectorAll('.app-module').forEach(function(el) {
          el.hidden = true;
        });
        document.getElementById('academyApp').hidden = (appId !== 'academy');
        
        var targetApp = document.getElementById(appId + 'App');
        if (targetApp) targetApp.hidden = false;
        
        return;
      }

      var docBtn = t.closest('[data-doc]');
      if (docBtn) {
        e.preventDefault();
        openDoc(docBtn.getAttribute('data-doc'));
        return;
      }

      var toggle = t.closest('[data-toggle-project]');
      if (toggle) {
        var pid = toggle.getAttribute('data-toggle-project');
        state.openProject = state.openProject === pid ? null : pid;
        render();
        return;
      }

      var readout = t.closest('[data-readout]');
      if (readout) {
        showReadout(readout.getAttribute('data-readout'));
        return;
      }

      var copyReadout = t.closest('[data-copy-readout]');
      if (copyReadout) {
        copyText(readoutFor(copyReadout.getAttribute('data-copy-readout')), 'Readout');
        return;
      }

      if (t.closest('[data-copy-oneonone]')) {
        copyText(oneOnOnePrep(), 'Agenda');
        return;
      }

      var logWrong = t.closest('[data-logwrong]');
      if (logWrong) {
        var lp = projectById(logWrong.getAttribute('data-logwrong'));
        closeModal();
        state.view = 'wrong';
        render();
        if (lp) {
          var sel = el('wProject');
          if (sel) sel.value = lp.ID;
          var pred = el('wPredicted');
          if (pred && lp.Prediction) pred.value = lp.Prediction;
          var actual = el('wActual');
          if (actual) actual.focus();
        }
        return;
      }

      var d2w = t.closest('[data-daily-to-wrong]');
      if (d2w) {
        var row = state.data.daily.filter(function (r) { return r.ID === d2w.getAttribute('data-daily-to-wrong'); })[0];
        state.view = 'wrong';
        render();
        if (row) {
          var box = el('wActual');
          if (box) {
            box.value = row['Surprised me'];
            box.focus();
          }
        }
        return;
      }

      var copyDaily = t.closest('[data-copy-daily]');
      if (copyDaily) {
        var dr = state.data.daily.filter(function (r) { return r.ID === copyDaily.getAttribute('data-copy-daily'); })[0];
        if (dr) copyText(dailyText(dr), 'Your three lines');
        return;
      }

      var edit = t.closest('[data-edit]');
      if (edit) {
        state.editing = edit.getAttribute('data-edit');
        render();
        return;
      }

      var save = t.closest('[data-save]');
      if (save) {
        saveEdit(save.getAttribute('data-save'));
        return;
      }

      var del = t.closest('[data-del]');
      if (del) {
        var section = del.getAttribute('data-del');
        if (!window.confirm('Delete ' + del.getAttribute('data-id') + '? This cannot be undone.')) return;
        call('apiDelete', section, del.getAttribute('data-id'))
          .then(function () {
            return reload(section, function () { toast('Deleted'); });
          })
          .catch(function (err) { toast(err, true); });
        return;
      }

      var act = t.closest('[data-act]');
      if (act) handleAction(act.getAttribute('data-act'));
    });

    function dailyText(row) {
      return [
        '1. ' + (row['Worked on'] || ''),
        '2. ' + (row.Learned || ''),
        '3. ' + (row['Surprised me'] || '')
      ].join('\n');
    }

    function saveEdit(key) {
      var parts = key.split('|');
      var section = parts[0];
      var id = parts[1];
      var scope = document.querySelector('[data-save="' + key + '"]').closest('.entry');
      var patch = {};
      scope.querySelectorAll('[data-e]').forEach(function (node) {
        patch[node.getAttribute('data-e')] = node.value;
      });
      call('apiUpdate', section, id, patch)
        .then(function () {
          state.editing = null;
          return reload(section, function () { toast('Saved'); });
        })
        .catch(function (err) { toast(err, true); });
    }

    function handleAction(action) {
      if (action === 'cancel-edit') {
        state.editing = null;
        render();
        return;
      }

      if (action === 'save-start') {
        var value = el('startDate').value;
        if (!value) {
          toast('Pick a date first.', true);
          return;
        }
        call('apiSetSetting', 'Start date', value)
          .then(function (res) {
            state.data.position = res.position;
            toast('Saved');
            render();
          })
          .catch(function (err) { toast(err, true); });
        return;
      }

      if (action === 'save-daily' || action === 'copy-daily') {
        var payload = {
          'Worked on': el('dWorked').value.trim(),
          Learned: el('dLearned').value.trim(),
          'Surprised me': el('dSurprised').value.trim(),
          'Keep/Kill done': el('dKeepKill') && el('dKeepKill').checked ? 'Yes' : 'No'
        };

        if (action === 'copy-daily') {
          copyText(dailyText(payload), 'Your three lines');
          return;
        }
        if (!payload['Worked on'] && !payload.Learned && !payload['Surprised me']) {
          toast('Write at least one line first.', true);
          return;
        }

        var existing = state.data.daily.filter(function (r) { return r.Date === state.data.today; })[0];
        var promise = existing
          ? call('apiUpdate', 'daily', existing.ID, payload)
          : call('apiCreate', 'daily', payload);

        promise
          .then(function () { return reload('daily', function () { toast('Saved'); }); })
          .catch(function (err) { toast(err, true); });
        return;
      }

      if (action === 'add-question') {
        var text = el('qNew').value.trim();
        if (!text) {
          toast('Write the question first.', true);
          return;
        }
        create('questions', {
          Question: text,
          Context: el('qContext').value.trim(),
          Project: el('qProject').value
        });
        return;
      }

      if (action === 'add-wrong') {
        var predicted = el('wPredicted').value.trim();
        var actual = el('wActual').value.trim();
        if (!predicted && !actual) {
          toast('Fill in at least the prediction and what happened.', true);
          return;
        }
        create('wrong', {
          Project: el('wProject').value,
          'I predicted': predicted,
          'What actually happened': actual,
          'Why I was off': el('wWhy').value.trim(),
          'Habit to watch': el('wHabit').value.trim()
        });
        return;
      }

      if (action === 'add-note') {
        var title = el('nTitle').value.trim();
        if (!title) {
          toast('Give it a title.', true);
          return;
        }
        create('notes', {
          Kind: el('nKind').value,
          Title: title,
          Who: el('nWho').value.trim(),
          Project: el('nProject').value,
          Body: el('nBody').value.trim(),
          'Follow-up': el('nFollow').value.trim()
        });
        return;
      }

      if (action === 'history') {
        state.trailOpen = !state.trailOpen;
        renderTrail();
        return;
      }

      if (action === 'palette') {
        openPalette();
        return;
      }

      if (action === 'oneonone') {
        showOneOnOne();
        return;
      }

      if (action === 'search-full') {
        var seed = state.palette.query || state.libraryFilter || '';
        closeModal();
        state.view = 'search';
        state.search.query = seed;
        render();
        var box = el('fullSearch');
        if (box) box.focus();
        if (seed) runSearch();
        return;
      }

      if (action === 'run-search') runSearch();
    }

    function runSearch() {
      var box = el('fullSearch');
      var query = box ? box.value.trim() : state.search.query;
      if (query.length < 2) {
        toast('Type at least two characters.', true);
        return;
      }
      state.search.query = query;
      state.search.busy = true;
      render();
      call('apiSearch', query)
        .then(function (result) {
          state.search.result = result;
          state.search.busy = false;
          render();
        })
        .catch(function (err) {
          state.search.busy = false;
          toast(err, true);
          render();
        });
    }

    function create(section, record) {
      call('apiCreate', section, record)
        .then(function () { return reload(section, function () { toast('Added'); }); })
        .catch(function (err) { toast(err, true); });
    }

    document.addEventListener('change', function (e) {
      var t = e.target;

      if (t.id === 'libFolder') {
        state.libraryFolder = t.value;
        refreshLibraryList();
        return;
      }
      if (t.id === 'docStatus') {
        saveDoc({ Status: t.value });
        return;
      }
      if (t.id === 'docNotes') {
        saveDoc({ 'My notes': t.value });
        return;
      }

      var project = t.getAttribute('data-project');
      if (project) {
        var patch = {};
        patch[t.getAttribute('data-f')] = t.value;
        call('apiSaveProject', project, patch)
          .then(function (row) {
            replaceRow(state.data.projects, row, 'ID');
            toast('Saved');
            render();
          })
          .catch(function (err) { toast(err, true); });
        return;
      }

      var skill = t.getAttribute('data-skill');
      if (skill) {
        var sp = {};
        sp[t.getAttribute('data-f')] = t.value;
        call('apiSaveSkill', skill, sp)
          .then(function (row) {
            replaceRow(state.data.skills, row, 'ID');
            toast('Saved');
            if (t.tagName === 'SELECT') render();
          })
          .catch(function (err) { toast(err, true); });
        return;
      }

      var system = t.getAttribute('data-system');
      if (system) {
        var yp = {};
        yp[t.getAttribute('data-f')] = t.value;
        call('apiSaveSystem', system, yp)
          .then(function (row) {
            replaceRow(state.data.systems, row, 'Tool');
            toast('Saved');
            renderNav();
          })
          .catch(function (err) { toast(err, true); });
        return;
      }

      var script = t.getAttribute('data-script');
      if (script) {
        var cp = {};
        cp[t.getAttribute('data-f')] = t.value;
        call('apiSaveScript', script, cp)
          .then(function (row) {
            replaceRow(state.data.scripts, row, 'ID');
            toast('Saved');
          })
          .catch(function (err) { toast(err, true); });
        return;
      }

      var section = t.getAttribute('data-section');
      if (section) {
        var lp = {};
        lp[t.getAttribute('data-f')] = t.value;
        call('apiUpdate', section, t.getAttribute('data-id'), lp)
          .then(function () { return reload(section, function () { toast('Saved'); }); })
          .catch(function (err) { toast(err, true); });
      }
    });

    function saveDoc(patch) {
      var id = state.openDoc;
      call('apiSaveDoc', id, patch)
        .then(function (row) {
          // The saved row comes back with its Body attached. Keep that out of the list state:
          // it is up to 25 KB per document and nothing in the list needs it.
          var light = {};
          Object.keys(row).forEach(function (k) {
            if (k !== 'Body') light[k] = row[k];
          });
          replaceRow(state.data.docs, light, 'ID');
          state.index[id] = light;
          toast('Saved');
          refreshLibraryList();
          renderNav();
        })
        .catch(function (err) { toast(err, true); });
    }

    /** Scroll events do not bubble, so this listens in the capture phase - that is the only way
     *  one listener on the document sees the reader pane scrolling inside it. */
    document.addEventListener('scroll', function (e) {
      var box = e.target;
      if (!box || !box.classList || !box.classList.contains('scroll')) return;
      clearTimeout(scrollNoteTimer);
      scrollNoteTimer = setTimeout(noteScroll, 180);
    }, true);

    document.addEventListener('input', function (e) {
      if (e.target.id === 'libSearch') {
        state.libraryFilter = e.target.value;
        refreshLibraryList();
        return;
      }
      if (e.target.id === 'paletteInput') updatePalette(e.target.value);
    });

    document.addEventListener('keydown', function (e) {
      var key = e.key;

      if ((e.metaKey || e.ctrlKey) && (key === 'k' || key === 'K')) {
        e.preventDefault();
        if (state.palette.open) closeModal();
        else openPalette();
        return;
      }

      if (key === 'Escape' && state.modal) {
        closeModal();
        return;
      }

      if (key === 'Escape' && state.trailOpen) {
        closeTrailMenu();
        return;
      }

      if (!state.palette.open) return;

      if (key === 'ArrowDown' || key === 'ArrowUp') {
        e.preventDefault();
        var n = state.palette.results.length;
        if (!n) return;
        state.palette.cursor = (state.palette.cursor + (key === 'ArrowDown' ? 1 : n - 1)) % n;
        drawPalette();
        var active = document.querySelector('.hits button.active');
        if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
        return;
      }

      if (key === 'Enter') {
        e.preventDefault();
        var item = state.palette.results[state.palette.cursor];
        if (item) item.run();
      }
    });

    /* ============================== boot ============================== */

    call('apiBootstrap')
      .then(function (data) {
        state.data = data;
        data.docs.forEach(function (d) {
          state.index[d.ID] = d;
        });
        renderBrand();
        render();
      })
      .catch(function (err) {
        el('main').innerHTML =
          '<div class="wrap"><div class="card"><h4>Could not load the workbook</h4><p>' +
          esc(err.message || err) + '</p>' +
          '<p style="color:var(--ink-3)">If this is the first time, run <b>Ramp workbook &gt; Set up workbook</b> ' +
          'from the menu in the spreadsheet, then reload.</p></div></div>';
      });

    // Exposed so the test harness can exercise the renderer against the real documents.
    window.MD = { render: renderMarkdown, resolveDocId: resolveDocId, esc: esc };

    // ...and so it can drive the trail's stack algebra without a browser around it.
    window.TRAIL = {
      push: trailPush, resume: resumeFrom, ago: ago, read: loadTrail,
      max: TRAIL_MAX, keep: TRAIL_KEEP
    };
  })();
</script>
