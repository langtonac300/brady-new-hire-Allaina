<script>
  /*
   * The client. One page, seven views, all drawn from the bootstrap payload.
   *
   * The markdown renderer near the top is the part that matters most: it is what turns the
   * imported source text back into something readable, and it is exercised against every
   * document in the library by the test harness kept with this project.
   */
  (function () {
    'use strict';

    // Sentinels for text that must survive the inline passes untouched. They are control
    // characters precisely because no real document contains them. Built with
    // fromCharCode so this file stays plain ASCII.
    var CODE_MARK = String.fromCharCode(0);
    var PIPE_MARK = String.fromCharCode(1);
    var RESTORE_RE = new RegExp(CODE_MARK + '(\\d+)' + CODE_MARK, 'g');

    /* ============================== markdown ============================== */

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function leading(line) {
      var m = String(line).match(/^[ \t]*/);
      return m ? m[0].replace(/\t/g, '    ').length : 0;
    }

    /**
     * Turn a relative Markdown link into a document ID.
     *
     * Links in the source are written relative to the file they sit in ("../02-learning/x.md"),
     * so resolving one needs to know which document is being read. A link to a folder resolves
     * to that folder's README, which is how the source uses them.
     */
    function resolveDocId(href, fromDocId, index) {
      var path = String(href || '').split('#')[0].trim();
      if (!path) return '';

      var baseDir = '';
      if (fromDocId && fromDocId.indexOf('/') !== -1) {
        baseDir = fromDocId.slice(0, fromDocId.lastIndexOf('/'));
      }

      var joined = path.charAt(0) === '/' ? path.slice(1) : baseDir + '/' + path;
      var out = [];
      joined.split('/').forEach(function (part) {
        if (!part || part === '.') return;
        if (part === '..') out.pop();
        else out.push(part);
      });

      var id = out.join('/').replace(/\.md$/i, '');
      if (!index) return id;
      if (index[id]) return id;
      if (index[id + '/README']) return id + '/README';
      return '';
    }

    /**
     * Inline formatting, deliberately split in two.
     *
     * Code spans are lifted out once here and put back once here. Everything in between
     * runs on the sentinel-carrying string via inlineBody(), including the recursive pass
     * over a link label.
     *
     * That split is the whole point. A link label is very often itself inline code - the
     * house style writes [`ppc-fundamentals.md`](../02-learning/ppc-fundamentals.md) - and
     * if that recursion restored code spans it would restore them against its own empty
     * list and render every such label as "undefined".
     */
    function inlineMd(text, ctx) {
      var codes = [];
      var s = String(text).replace(/`([^`]+)`/g, function (m, c) {
        codes.push(c);
        return CODE_MARK + (codes.length - 1) + CODE_MARK;
      });

      s = inlineBody(s, ctx);

      return s.replace(RESTORE_RE, function (m, i) {
        return '<code>' + codes[Number(i)] + '</code>';
      });
    }

    function inlineBody(s, ctx) {

      s = s.replace(/\[([^\]]*)\]\(([^)\s]*)(?:\s+&quot;[^&]*&quot;)?\)/g, function (m, label, href) {
        var text = inlineBody(label, ctx);
        if (/^https?:/i.test(href)) {
          return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + text + '</a>';
        }
        if (href.charAt(0) === '#') return text;
        var id = resolveDocId(href, ctx.docId, ctx.index);
        if (id) return '<a class="doclink" href="#" data-doc="' + esc(id) + '">' + text + '</a>';
        return '<span class="dead">' + text + '</span>';
      });

      // Emphasis, in the order the shapes have to be resolved.
      //
      // The source nests italic inside bold in a lot of places, and when the italic sits at
      // either end the two runs collide into a *** that has to be split the right way round.
      // "**tools is *for***" is bold-containing-italic, not italic-containing-bold, and a
      // single lazy ** rule gets that backwards and interleaves the tags.
      s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
      s = s.replace(/\*\*([^*]*)\*([^*]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
      s = s.replace(/\*\*\*([^*]+)\*([^*]*)\*\*/g, '<strong><em>$1</em>$2</strong>');
      s = s.replace(/\*\*((?:[^*]|\*(?!\*))+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      s = s.replace(/(^|[^_\w])_([^_\n]+)_(?![_\w])/g, '$1<em>$2</em>');
      s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');

      return s;
    }

    function splitRow(line) {
      var t = String(line).trim().replace(/\\\|/g, PIPE_MARK);
      if (t.charAt(0) === '|') t = t.slice(1);
      if (t.charAt(t.length - 1) === '|') t = t.slice(0, -1);
      return t.split('|').map(function (c) {
        return c.split(PIPE_MARK).join('|').trim();
      });
    }

    function isTableSeparator(line) {
      var t = String(line).trim();
      return t.indexOf('-') !== -1 && t.indexOf('|') !== -1 && /^\|?[\s:|-]+\|?$/.test(t);
    }

    function isBlockStart(line) {
      return (
        !String(line).trim() ||
        /^\s*#{1,6}\s/.test(line) ||
        /^\s*>/.test(line) ||
        /^\s*```/.test(line) ||
        /^\s*([-*_])\1{2,}\s*$/.test(line) ||
        /^\s*([-*+]|\d+[.)])\s+/.test(line)
      );
    }

    /** A list, however it is nested. Returns the HTML and the line to carry on from. */
    function listBlock(lines, start, ctx) {
      var first = lines[start].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
      var indent = leading(first[1]);
      var ordered = /\d/.test(first[2]);
      var items = [];
      var i = start;

      while (i < lines.length) {
        var line = lines[i];

        if (!line.trim()) {
          var next = lines[i + 1];
          if (next && next.trim() && leading(next) >= indent && /^\s*([-*+]|\d+[.)])\s+/.test(next)) {
            i++;
            continue;
          }
          break;
        }

        var m = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        var ind = leading(line);

        if (m && ind === indent) {
          items.push({ lines: [m[3]], nested: [] });
          i++;
          continue;
        }

        if (!items.length) break;

        if (ind > indent) {
          // Indented prose under a bullet is the same sentence carrying on, not a new block.
          // The source hard-wraps at about 95 characters and indents the wrapped line, so
          // treating those as nested blocks would split a sentence - and any bold or italic
          // spanning the wrap - across two elements.
          if (!/^\s*([-*+]|\d+[.)])\s+/.test(line) && !/^\s*```/.test(line)) {
            items[items.length - 1].lines.push(line.trim());
            i++;
            continue;
          }

          // A genuine nested block: another list, or a fenced one.
          var chunk = [];
          while (i < lines.length && (!lines[i].trim() || leading(lines[i]) > indent)) {
            if (!lines[i].trim() && !(lines[i + 1] && leading(lines[i + 1]) > indent)) break;
            chunk.push(lines[i].slice(Math.min(leading(lines[i]), indent + 2)));
            i++;
          }
          items[items.length - 1].nested = items[items.length - 1].nested.concat(chunk);
          continue;
        }

        if (!m && ind >= indent) {
          items[items.length - 1].lines.push(line.trim());
          i++;
          continue;
        }

        break;
      }

      var isTaskList = items.length > 0 && items.every(function (it) {
        return /^\[[ xX]\]\s/.test(it.lines[0]);
      });

      var html = items
        .map(function (it) {
          var head = it.lines.join(' ');
          var cls = '';
          var box = '';
          var task = head.match(/^\[([ xX])\]\s+(.*)$/);
          if (task) {
            cls = ' class="task"';
            box = '<input type="checkbox" disabled' + (task[1].toLowerCase() === 'x' ? ' checked' : '') + '> ';
            head = task[2];
          }
          var inner = inlineMd(esc(head), ctx);
          var sub = it.nested.length ? renderMarkdown(it.nested.join('\n'), ctx) : '';
          return '<li' + cls + '>' + box + inner + (sub ? '\n' + sub : '') + '</li>';
        })
        .join('\n');

      var tag = ordered ? 'ol' : 'ul';
      var attr = isTaskList ? ' style="list-style:none;padding-left:4px"' : '';
      return { html: '<' + tag + attr + '>\n' + html + '\n</' + tag + '>', next: i };
    }

    /** Markdown to HTML. Deliberately small: it covers what the source material uses. */
    function renderMarkdown(src, ctx) {
      ctx = ctx || {};
      if (!ctx.index) ctx.index = {};
      var lines = String(src == null ? '' : src).replace(/\r\n/g, '\n').split('\n');
      var out = [];
      var i = 0;

      while (i < lines.length) {
        var line = lines[i];

        if (!line.trim()) {
          i++;
          continue;
        }

        var fence = line.match(/^\s*```(.*)$/);
        if (fence) {
          var code = [];
          i++;
          while (i < lines.length && !/^\s*```/.test(lines[i])) {
            code.push(lines[i]);
            i++;
          }
          i++;
          out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
          continue;
        }

        var heading = line.match(/^\s*(#{1,6})\s+(.*?)\s*#*\s*$/);
        if (heading) {
          var level = heading[1].length;
          out.push('<h' + level + '>' + inlineMd(esc(heading[2]), ctx) + '</h' + level + '>');
          i++;
          continue;
        }

        if (/^\s*([-*_])\1{2,}\s*$/.test(line)) {
          out.push('<hr>');
          i++;
          continue;
        }

        if (/^\s*>/.test(line)) {
          var quoted = [];
          while (i < lines.length && (/^\s*>/.test(lines[i]) || (quoted.length && lines[i].trim() && !isBlockStart(lines[i])))) {
            quoted.push(lines[i].replace(/^\s*>\s?/, ''));
            i++;
          }
          out.push('<blockquote>' + renderMarkdown(quoted.join('\n'), ctx) + '</blockquote>');
          continue;
        }

        if (line.indexOf('|') !== -1 && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
          var header = splitRow(line);
          var aligns = splitRow(lines[i + 1]).map(function (c) {
            if (/^:-+:$/.test(c)) return 'center';
            if (/-+:$/.test(c)) return 'right';
            return 'left';
          });
          i += 2;

          var bodyRows = [];
          while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') !== -1) {
            bodyRows.push(splitRow(lines[i]));
            i++;
          }

          var hasHeader = header.some(function (h) {
            return h !== '';
          });

          var html = '<div class="tablewrap"><table>';
          if (hasHeader) {
            html += '<thead><tr>' + header.map(function (h, c) {
              return '<th style="text-align:' + (aligns[c] || 'left') + '">' + inlineMd(esc(h), ctx) + '</th>';
            }).join('') + '</tr></thead>';
          }
          html += '<tbody>' + bodyRows.map(function (row) {
            var cells = [];
            for (var c = 0; c < header.length; c++) {
              cells.push('<td style="text-align:' + (aligns[c] || 'left') + '">' + inlineMd(esc(row[c] || ''), ctx) + '</td>');
            }
            return '<tr>' + cells.join('') + '</tr>';
          }).join('') + '</tbody></table></div>';

          out.push(html);
          continue;
        }

        if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
          var list = listBlock(lines, i, ctx);
          out.push(list.html);
          i = list.next;
          continue;
        }

        var para = [];
        while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) {
          para.push(lines[i].trim());
          i++;
        }
        // Joined with a space, not a newline: a single line break inside a paragraph is a
        // space in Markdown, and the source relies on that everywhere it hard-wraps prose.
        if (para.length) out.push('<p>' + inlineMd(esc(para.join(' ')), ctx) + '</p>');
        else i++;
      }

      return out.join('\n');
    }

    /* ============================== plumbing ============================== */

    var IMG = window.IMG || {};

    var state = {
      view: 'today',
      data: null,
      index: {},
      openDoc: null,
      docCache: {},
      diagrams: {},
      diagramsAsked: {},
      libraryFilter: '',
      libraryFolder: 'All',
      openProject: null,
      editing: null,
      modal: null,
      trailOpen: false,
      palette: { open: false, query: '', results: [], cursor: 0 },
      search: { query: '', result: null, busy: false }
    };

    /** Promise wrapper over google.script.run. The runner has to stay the receiver of the
     *  call, which is why this uses apply(runner, ...) rather than apply(null, ...). */
    function call(name) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(function (res) {
            if (res && res.ok) resolve(res.data);
            else reject(new Error((res && res.error) || 'The server did not say why that failed.'));
          })
          .withFailureHandler(function (err) {
            reject(err instanceof Error ? err : new Error(String(err && err.message ? err.message : err)));
          });
        runner[name].apply(runner, args);
      });
    }

    var toastTimer = null;
    function toast(message, isError) {
      var el0 = el('toast');
      el0.textContent = String(message && message.message ? message.message : message);
      el0.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        el0.className = 'toast';
      }, isError ? 6500 : 1700);
    }

    function el(id) {
      return document.getElementById(id);
    }

    function chipFor(value) {
      var map = {
        Done: 'green', Read: 'green', Answered: 'green', Independent: 'green', Granted: 'green',
        Running: 'green', Held: 'green',
        'In progress': 'blue', Reading: 'blue', Requested: 'blue', Draft: 'blue',
        'Ready for readout': 'amber', Developing: 'amber', 'Came in under': 'amber',
        Blocked: 'red', Open: 'red', 'Not yet': 'red', 'Ran over': 'red'
      };
      return 'chip ' + (map[value] || '');
    }

    function options(list, selected) {
      return list.map(function (o) {
        return '<option value="' + esc(o) + '"' + (o === selected ? ' selected' : '') + '>' + esc(o) + '</option>';
      }).join('');
    }

    function field(label, control) {
      return '<label class="field"><span>' + esc(label) + '</span>' + control + '</label>';
    }

    function nl2br(text) {
      return esc(text).replace(/\n/g, '<br>');
    }

    /**
     * Copy text, three ways.
     *
     * The clipboard API is the good path but it is not always permitted inside the frame this
     * app runs in, so there is a fallback, and behind that a dialog that simply shows the text
     * selected and ready for a manual copy. Something always works.
     */
    function copyText(text, label) {
      function fallback() {
        var box = document.createElement('textarea');
        box.value = text;
        box.style.position = 'fixed';
        box.style.opacity = '0';
        document.body.appendChild(box);
        box.focus();
        box.select();
        var worked = false;
        try {
          worked = document.execCommand('copy');
        } catch (err) {
          worked = false;
        }
        document.body.removeChild(box);
        if (worked) toast((label || 'Copied') + ' to the clipboard');
        else showCopyDialog(text, label);
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () {
            toast((label || 'Copied') + ' to the clipboard');
          },
          fallback
        );
      } else {
        fallback();
      }
    }

    function showCopyDialog(text, label) {
      openModal({
        title: label || 'Copy this',
        body: '<p class="lede" style="margin-bottom:12px">Select it and copy - this page could not reach the clipboard for you.</p>' +
          '<pre class="copyable" id="copyBox">' + esc(text) + '</pre>',
        footer: '<button class="btn quiet" data-close>Close</button>'
      });
      var box = el('copyBox');
      if (box && window.getSelection) {
        var range = document.createRange();
        range.selectNodeContents(box);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }

    /* ============================== modal ============================== */

    function openModal(spec) {
      state.modal = spec;
      var host = el('modalHost');
      host.innerHTML =
        '<div class="scrim" data-scrim>' +
        '<div class="modal' + (spec.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' +
        (spec.title
          ? '<div class="mhead"><h3>' + esc(spec.title) + '</h3>' +
            '<button class="btn quiet small push" data-close>Close</button></div>'
          : '') +
        '<div class="mbody">' + spec.body + '</div>' +
        (spec.footer ? '<div class="mfoot">' + spec.footer + '</div>' : '') +
        '</div></div>';
      host.hidden = false;
      if (spec.focus) {
        var target = el(spec.focus);
        if (target) target.focus();
      }
    }

    function closeModal() {
      state.modal = null;
      state.palette.open = false;
      var host = el('modalHost');
      host.innerHTML = '';
      host.hidden = true;
    }

    /* ============================== ramp calendar ============================== */

    /**
     * The week-by-week shape of the ramp, transcribed from the source. The bands overlap on
     * purpose - more than one is usually true at once, which is exactly why "what am I doing
     * this week" is not obvious from the project list alone.
     */
    var WEEK_BANDS = [
      { from: 1, to: 2, phase: 'Learn', ladder: 'Onboarding, reading and shadowing, plus your first paired project (T1-1).', alongside: 'Start your questions list. Three lines in chat each evening.' },
      { from: 3, to: 5, phase: 'Learn', ladder: 'Tier 1 - one-hour, read-only projects, about two a week.', alongside: 'Sit in on the weekly meetings. Keep working through the fundamentals.' },
      { from: 4, to: 7, phase: 'Learn into Assist', ladder: 'Tier 2 - half-day projects, reviewed. Mecco begins (M-1 to M-3).', alongside: 'The daily keep/kill review becomes your one standing habit, around day 31.' },
      { from: 7, to: 10, phase: 'Assist into Own', ladder: 'Tier 3 - one-to-two-day diagnosis work, and your first live experiment.', alongside: 'Mecco is yours. M-5 becomes a standing weekly line, around day 45.' },
      { from: 11, to: 13, phase: 'Own', ladder: 'Week-long capstones - end-to-end work you own and present.', alongside: 'Own and present your PDC section of the monthly Deep Dive.' }
    ];

    var MEETINGS = [
      ['Mon', '1:00', 'Meta Monday', "Stuart's digital team - SEO, Email and Paid in one room."],
      ['Tue', '10:00', 'L10 Huddle', 'Your team’s weekly. Bring a segue item from week one.'],
      ['Wed', '2:00', 'Seton / EMEDCO weekly', 'Contribution track - bring what your audits turn up.'],
      ['Thu', '10:00', 'Search Deep Dive', 'The performance review working session.'],
      ['Fri', '9:00', 'Development block', 'Two protected hours. It is the first thing that gets eaten.'],
      ['Weekly', '', '1:1 with Alex', 'Yours to run - you bring the agenda.']
    ];

    function currentWeek() {
      var p = state.data.position;
      if (!p.started || p.day === null || p.day < 1) return null;
      return Math.floor((p.day - 1) / 7) + 1;
    }

    function phaseArt() {
      var p = state.data.position;
      if (!p.started || p.day === null) return IMG.phaseLearn;
      if (p.day <= 30) return IMG.phaseLearn;
      if (p.day <= 60) return IMG.phaseAssist;
      return IMG.phaseOwn;
    }

    function deepDiveExpectation() {
      var p = state.data.position;
      if (!p.started || p.day === null) return '';
      if (p.day <= 30) return 'Watch how analysts pull the numbers and how the "why" gets written.';
      if (p.day <= 60) return 'Co-author the PDC section - pull the numbers, draft the explanation.';
      return 'Own the PDC section end to end, and present it.';
    }

    /* ============================== views ============================== */

    /**
     * The rail.
     *
     * The first two groups carry icons because the kit covers every item in them. Reference
     * has no icons for Systems or Scripts, and three-quarters of a set reads as an oversight
     * rather than a choice - so that group is text throughout, and its one icon is used on
     * the Self-assessment page heading instead.
     */
    var NAV = [
      { group: 'The ramp' },
      { id: 'today', label: 'Today', icon: 'navToday' },
      { id: 'library', label: 'Library', icon: 'navLibrary' },
      { id: 'ladder', label: 'The ladder', icon: 'navLadder' },
      { group: 'My log' },
      { id: 'questions', label: 'Questions', icon: 'navQuestions' },
      { id: 'wrong', label: 'What I got wrong', icon: 'navWrong' },
      { id: 'notes', label: 'Notes', icon: 'navNotes' },
      { id: 'daily', label: 'Daily lines', icon: 'navToday' },
      { group: 'Reference' },
      { id: 'systems', label: 'Systems' },
      { id: 'scripts', label: 'Scripts' },
      { id: 'skills', label: 'Self-assessment' }
    ];

    var FOLDER_ART = {
      Overview: 'folderOverview',
      'Start here': 'folderStartHere',
      Learning: 'folderLearning',
      Projects: 'folderProjects',
      'My work': 'folderMyWork',
      'Self-assessment': 'folderSelfAssess'
    };

    var MEETING_ART = [
      'meetingMetaMonday', 'meetingL10', 'meetingSetonEmedco', 'meetingDeepDive', 'meetingOneOnOne'
    ];

    var STATUS_STAMP = {
      Done: 'stampDone',
      'In progress': 'stampInProgress',
      'Ready for readout': 'stampReady',
      Blocked: 'stampBlocked'
    };

    var ACCOUNT_ART = { 'PDC Healthcare': 'accountPdc', 'Seton US': 'accountSeton' };

    /**
     * Concept diagrams, pinned to the documents that teach each concept.
     *
     * A diagram can serve more than one document - the guardrail one is the same idea whether
     * it is met on the drill or on the pacing note - so the map is many-to-one on purpose.
     *
     * These are the only images not inlined into the page: each is a slide of about 70 KB, and
     * they are fetched one at a time by diagramFor() below.
     */
    var DOC_DIAGRAM = {
      '02-learning/how-brady-measures': 'diagramAttribution',
      '02-learning/ppc-fundamentals': 'diagramKeywordSearchTerm',
      '03-projects/t1-03-keyword-vs-search-term': 'diagramKeywordSearchTerm',
      '03-projects/t1-06-guardrail-drill': 'diagramGuardrail',
      '03-projects/t2-04-the-pacing-note': 'diagramGuardrail',
      '02-learning/the-l10-huddle': 'diagramL10',
      '02-learning/how-to-run-a-project': 'diagramProjectLoop',
      '02-learning/what-a-deliverable-looks-like': 'diagramDeliverable',
      '03-projects/t1-01-account-tour': 'diagramDeliverable',
      '02-learning/who-else-is-searching': 'diagramArchetypes',
      '03-projects/t2-01-sqr-predict-then-compare': 'diagramArchetypes',
      '02-learning/before-it-ships': 'diagramPreship',
      '02-learning/running-a-real-test': 'diagramTestModes',
      '03-projects/t3-05-your-first-experiment': 'diagramTestModes',
      '02-learning/pdc-primer': 'diagramPdc',
      '03-projects/t1-04-conversion-action-inventory': 'diagramPdc',
      '02-learning/seton-emedco-primer': 'diagramSetonEmedco',
      '02-learning/cheat-sheet': 'diagramKeepKill'
    };

    /**
     * The diagram for a document, if it has one and it has arrived. Asking for one that has not
     * arrived starts the fetch and returns nothing; the reader redraws when it lands, the same
     * way it does for a document body.
     */
    function diagramFor(docId) {
      var key = DOC_DIAGRAM[docId];
      if (!key) return '';
      if (state.diagrams[key]) return state.diagrams[key];
      if (state.diagramsAsked[key]) return '';
      state.diagramsAsked[key] = true;
      call('apiGetDiagram', key)
        .then(function (uri) {
          state.diagrams[key] = uri;
          if (DOC_DIAGRAM[state.openDoc] === key) render();
        })
        .catch(function () {
          // Not worth a toast. The document is the point; the picture is an aid, and a
          // missing one should not put an error in front of her.
          state.diagramsAsked[key] = false;
        });
      return '';
    }

    function counts() {
      var d = state.data;
      return {
        library: d.docs.filter(function (x) { return x.Status !== 'Read' && x.Status !== 'Reference'; }).length,
        ladder: d.projects.filter(function (x) { return x.Status !== 'Done' && !x['Same as']; }).length,
        questions: d.questions.filter(function (x) { return x.Status === 'Open'; }).length,
        wrong: d.wrong.length,
        notes: d.notes.length,
        daily: d.daily.length,
        systems: d.systems.filter(function (x) { return x.Status !== 'Granted'; }).length,
        scripts: d.scripts.length
      };
    }

    var HOT = { questions: true, systems: true };

    function renderNav() {
      var c = counts();
      el('nav').innerHTML = NAV.map(function (item) {
        if (item.group) return '<div class="group">' + esc(item.group) + '</div>';
        var n = c[item.id];
        var hot = HOT[item.id] && n > 0 ? ' hot' : '';
        return (
          '<button data-view="' + item.id + '" aria-current="' + (state.view === item.id) + '">' +
          (item.icon && IMG[item.icon] ? '<img class="navicon" src="' + IMG[item.icon] + '" alt="">' : '') +
          '<span class="lbl">' + esc(item.label) + '</span>' +
          (n === undefined ? '' : '<span class="count' + hot + '">' + n + '</span>') +
          '</button>'
        );
      }).join('');
    }

    /** The masthead wordmark. Uses the real asset when it has been added to the kit, and a
     *  plain text lockup until then - a hand-drawn approximation of a trademark would be
     *  worse than no logo at all. */
    function renderBrand() {
      var host = el('brand');
      if (!host) return;
      host.innerHTML = IMG.logo
        ? '<img class="logo" src="' + IMG.logo + '" alt="Brady"><span class="rule"></span>' +
          '<span class="wordmark">The ramp</span>'
        : '<span class="wordmark">The ramp</span><span class="sub">Brady Americas</span>';
    }

    function renderHeader() {
      var p = state.data.position;
      var chip = el('daychip');
      if (p.started && p.day !== null && p.day >= 1) {
        chip.hidden = false;
        el('dayNumber').textContent = 'Day ' + p.day;
        el('dayPhase').textContent = p.phase;
      } else if (p.started && p.day !== null && p.day < 1) {
        chip.hidden = false;
        el('dayNumber').textContent = 'Starts ' + p.startDate;
        el('dayPhase').textContent = 'Not started yet';
      } else {
        chip.hidden = true;
      }
      el('whoami').textContent = state.data.displayName || '';
    }

    /* ====================== where you are, where you were ======================
     *
     * Three pieces answer "where was I?", and all three read from one small stack:
     *
     *   the breadcrumb     where you are now         topbar, after the day chip
     *   the trail chips    where you were            topbar, right
     *   the resume banner  what you left unfinished  under the topbar
     *
     * The head of the stack IS the current location. Everything on offer therefore starts at
     * index 1: the top of the stack is already on screen as the breadcrumb, and a button that
     * jumps to where you are standing is noise.
     *
     * The stack is written to localStorage so it survives a reload - and it survives
     * localStorage not being there at all, which does happen. This runs in a sandboxed iframe,
     * and both the window over the Sheet and a browser with third-party storage turned off can
     * make the object throw on access rather than politely return null.
     */

    var TRAIL_KEY = 'ramp.trail';
    var TRAIL_KEEP = 8;                 // stops offered back...
    var TRAIL_MAX = TRAIL_KEEP + 1;     // ...plus the one being stood on
    var RESUME_MIN = 0.04;              // below this it was never really started
    var RESUME_DONE = 0.9;              // above this it is finished, and offering it back nags

    var memoryStore = { local: {}, session: {} };

    function readStore(which, key) {
      try {
        var value = window[which + 'Storage'].getItem(key);
        if (value !== null && value !== undefined) return value;
      } catch (err) {
        /* no storage here - the in-memory copy is all there is */
      }
      return memoryStore[which][key];
    }

    function writeStore(which, key, value) {
      memoryStore[which][key] = value;
      try {
        window[which + 'Storage'].setItem(key, value);
      } catch (err) {
        /* memory only, which is fine - none of this is worth an error message */
      }
    }

    var trail = loadTrail();
    var pendingScroll = null;
    var scrollNoteTimer = null;

    function loadTrail() {
      var raw = readStore('local', TRAIL_KEY);
      if (!raw) return [];
      try {
        var rows = JSON.parse(raw);
        if (!rows || !rows.length) return [];
        return rows
          .filter(function (row) { return row && row.key && row.label; })
          .slice(0, TRAIL_MAX);
      } catch (err) {
        return [];                      // a half-written stack is not worth recovering
      }
    }

    function saveTrail() {
      writeStore('local', TRAIL_KEY, JSON.stringify(trail));
    }

    function now() {
      return new Date().getTime();
    }

    /** Relative time at the grain a trail actually needs: minutes for the first hour, then
     *  hours, then days. */
    function ago(ts, from) {
      var mins = Math.floor(((from || now()) - Number(ts || 0)) / 60000);
      if (!(mins >= 0)) return '';
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + ' min ago';
      var hours = Math.floor(mins / 60);
      if (hours < 24) return hours === 1 ? 'an hour ago' : hours + ' hours ago';
      var days = Math.floor(hours / 24);
      return days === 1 ? 'yesterday' : days + ' days ago';
    }

    function navItem(view) {
      for (var i = 0; i < NAV.length; i++) {
        if (NAV[i].id === view) return NAV[i];
      }
      return null;
    }

    /** The location on screen, described the way the trail records it. */
    function here() {
      var item = navItem(state.view);
      var spot = {
        key: state.view,
        view: state.view,
        doc: '',
        project: '',
        label: item ? item.label : (state.view === 'search' ? 'Search' : 'The ramp'),
        sub: '',
        icon: (item && item.icon) || 'navToday'
      };
      spot.crumbs = [spot.label];

      if (state.view === 'library' && state.openDoc && state.index[state.openDoc]) {
        var meta = state.index[state.openDoc];
        spot.key = 'library:' + state.openDoc;
        spot.doc = state.openDoc;
        spot.label = meta.Title;
        spot.sub = 'Library · ' + meta.Folder;
        spot.crumbs = ['Library', meta.Folder, meta.Title];
      } else if (state.view === 'ladder' && state.openProject) {
        var project = projectById(state.openProject);
        if (project) {
          spot.key = 'ladder:' + project.ID;
          spot.project = project.ID;
          spot.label = project.ID + ' · ' + project.Project;
          spot.sub = 'The ladder';
          spot.crumbs = ['The ladder', spot.label];
        }
      } else if (state.view === 'search' && state.search.query) {
        spot.crumbs = ['Search', '"' + state.search.query + '"'];
      }

      return spot;
    }

    /**
     * Put a location on top of the stack. Three rules, and the second is the one that keeps a
     * trail readable rather than a log of every toggle:
     *
     *   standing still is not a move   the same key twice running updates rather than stacks
     *   revisiting moves, not copies   an older entry for the same place is lifted out, and its
     *                                  reading position comes up with it
     *   the stack is capped            oldest off the bottom
     *
     * Kept free of the DOM and of the clock so the test harness can drive it.
     */
    function trailPush(stack, spot, ts) {
      var head = stack[0];
      if (head && head.key === spot.key) {
        head.label = spot.label;        // a title can be edited underneath it
        head.sub = spot.sub;
        return stack;
      }

      var carried = null;
      var rest = stack.filter(function (row) {
        if (row.key !== spot.key) return true;
        carried = row;
        return false;
      });

      rest.unshift({
        key: spot.key, view: spot.view, doc: spot.doc, project: spot.project,
        label: spot.label, sub: spot.sub, icon: spot.icon, ts: ts,
        scroll: carried ? carried.scroll : 0,
        mark: carried ? carried.mark : ''
      });
      return rest.slice(0, TRAIL_MAX);
    }

    function pushTrail() {
      if (!state.data) return;
      trail = trailPush(trail, here(), now());
      saveTrail();
    }

    /** The most recent document that was started and not finished. Index 0 is where she is
     *  standing, so it is never a candidate. */
    function resumeFrom(stack, allowed) {
      for (var i = 1; i < stack.length; i++) {
        var row = stack[i];
        if (!row.doc) continue;
        if (!(row.scroll > RESUME_MIN && row.scroll < RESUME_DONE)) continue;
        if (allowed && !allowed(row)) continue;
        return row;
      }
      return null;
    }

    function resumeCandidate() {
      if (!state.data) return null;
      return resumeFrom(trail, function (row) {
        return !!state.index[row.doc] && readStore('session', 'ramp.resume.' + row.doc) !== 'off';
      });
    }

    /** The reader pane, but only once the document is actually in it. While it still says
     *  Loading the pane is one screen tall, and measuring it would record "read to the end". */
    function readerBox() {
      var box = document.querySelector('.reader .scroll');
      return box && box.querySelector('.md') ? box : null;
    }

    /** How far down the open document the reading has got. Called on scroll, throttled, and
     *  once more on the way out - the last few pixels before a click would otherwise be lost. */
    function noteScroll() {
      var head = trail[0];
      if (!head || !head.doc) return;
      var box = readerBox();
      if (!box) return;
      var span = box.scrollHeight - box.clientHeight;
      head.scroll = span > 24 ? Math.max(0, Math.min(1, box.scrollTop / span)) : 1;
      head.mark = headingAbove(box);
      saveTrail();
    }

    /** The heading last scrolled past, so the resume line can name a place rather than only a
     *  percentage. Measured against the pane rather than the page: the pane is not a positioned
     *  ancestor, so offsetTop here belongs to something else entirely. */
    function headingAbove(box) {
      var heads = box.querySelectorAll('.md h1, .md h2, .md h3');
      var edge = box.getBoundingClientRect().top + 90;
      var found = '';
      for (var i = 0; i < heads.length; i++) {
        if (heads[i].getBoundingClientRect().top > edge) break;
        found = heads[i].textContent || '';
      }
      return clip(found.replace(/\s+/g, ' '), 52);
    }

    /** A title dropped into the middle of a sentence has to be short enough that the sentence
     *  still reads. The reader head and the library list carry the whole one. */
    function clip(text, limit) {
      var s = String(text == null ? '' : text).trim();
      return s.length > limit ? s.slice(0, limit - 1).replace(/[\s,;:.-]+$/, '') + '...' : s;
    }

    /** Go back to a stop. A document also restores where it was left. */
    function jumpTo(row) {
      if (!row) return;
      closeTrailMenu();
      if (row.doc) {
        if (!state.index[row.doc]) {
          toast('That document is not in the library.', true);
          return;
        }
        pendingScroll = { doc: row.doc, frac: Number(row.scroll) || 0 };
        openDoc(row.doc);
        return;
      }
      if (row.project) {
        gotoProject(row.project);
        return;
      }
      closeModal();
      state.view = row.view;
      // A bare Library or ladder stop is that page with nothing open on it, which is what it
      // looked like when she was last there.
      if (row.view === 'library') state.openDoc = null;
      if (row.view === 'ladder') state.openProject = null;
      render();
    }

    /**
     * Put the reader back where she left off. The folder banner and any concept diagram are
     * data URIs that decode a frame or two after this runs and change the height underneath the
     * position just set, so it is applied again - but only while the position is still the one
     * that was set, so a reader who has already started scrolling is never yanked.
     */
    function restoreScroll() {
      if (!pendingScroll) return;
      if (state.openDoc !== pendingScroll.doc) {
        pendingScroll = null;
        return;
      }
      var box = readerBox();
      if (!box) return;                 // body still on its way; the next render will do it
      var frac = pendingScroll.frac;
      pendingScroll = null;
      if (!(frac > 0)) return;

      var placed = -1;
      var put = function () {
        if (placed >= 0 && Math.abs(box.scrollTop - placed) > 3) return;
        var span = box.scrollHeight - box.clientHeight;
        if (span <= 0) return;
        placed = Math.round(span * frac);
        box.scrollTop = placed;
      };
      put();
      setTimeout(put, 90);
      setTimeout(put, 320);
    }

    /* ---- drawing it ---- */

    /* Drawn rather than lettered: there is no icon font on this page, the house rule is no
       emoji in the interface, and nothing may be fetched from outside the payload. */
    var ICON = {
      pin: '<svg class="pin" viewBox="0 0 16 16" aria-hidden="true" focusable="false">' +
        '<path fill="currentColor" d="M8 .9a4.7 4.7 0 0 0-4.7 4.7c0 3.4 4.1 9.1 4.3 9.3a.5.5 0 0 0 .8 0c.2-.2 4.3-5.9 4.3-9.3A4.7 4.7 0 0 0 8 .9z"/></svg>',
      back: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
        '<path d="M2.6 8a5.4 5.4 0 1 0 1.7-3.9"/><path d="M2.2 2.5v2.9h2.9"/><path d="M8 5.2V8l2 1.5"/></svg>',
      caret: '<svg class="caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ' +
        'focusable="false"><path d="M4 6.5 8 10.5 12 6.5"/></svg>',
      bookmark: '<svg class="mark" viewBox="0 0 16 16" aria-hidden="true" focusable="false">' +
        '<path fill="currentColor" d="M3.5 1.6h9a.6.6 0 0 1 .6.6v12.1a.4.4 0 0 1-.65.32L8 11.1l-4.45 3.52a.4.4 0 0 1-.65-.32V2.2a.6.6 0 0 1 .6-.6z"/></svg>'
    };

    function renderCrumbs() {
      var host = el('crumbs');
      if (!host) return;
      if (!state.data) {
        host.innerHTML = '';
        return;
      }
      var html = ICON.pin;
      var parts = here().crumbs;
      parts.forEach(function (part, i) {
        if (i) html += '<span class="sep" aria-hidden="true">&rsaquo;</span>';
        html += i === parts.length - 1
          ? '<span class="seg now" aria-current="page">' + esc(part) + '</span>'
          : '<span class="seg">' + esc(part) + '</span>';
      });
      host.innerHTML = html;
    }

    function trailChip(row, index, cls) {
      return '<button class="tchip ' + cls + '" data-trail="' + index + '" ' +
        'title="' + esc('Back to ' + row.label) + '">' +
        (cls === 'back' ? ICON.back : '') +
        '<span class="t">' + esc(row.label) + '</span></button>';
    }

    function trailMenu(stops) {
      var rows = stops.slice(0, TRAIL_KEEP).map(function (row, i) {
        return '<li><button data-trail="' + (i + 1) + '">' +
          (IMG[row.icon] ? '<img class="navicon" src="' + IMG[row.icon] + '" alt="">' : '') +
          '<span class="rowcopy">' +
          '<span class="t">' + esc(row.label) + '</span>' +
          '<span class="s">' + esc([row.sub, ago(row.ts)].filter(Boolean).join(' · ')) + '</span>' +
          '</span><span class="jump">Jump back</span></button></li>';
      }).join('');

      return '<div class="trailmenu">' +
        '<div class="tmhead">Your trail &middot; newest first</div>' +
        '<ul>' + rows + '</ul>' +
        '<div class="tmfoot">The trail keeps your last ' + TRAIL_KEEP +
        ' stops. Click any of them to jump back.</div></div>';
    }

    function renderTrail() {
      var host = el('trail');
      if (!host) return;
      var stops = state.data ? trail.slice(1) : [];
      if (!stops.length) {
        // Nothing to go back to yet. An empty History pill would only be furniture.
        host.innerHTML = '';
        state.trailOpen = false;
        return;
      }

      host.innerHTML =
        '<span class="lbl">Where you were</span>' +
        trailChip(stops[0], 1, 'back') +
        (stops[1] ? trailChip(stops[1], 2, 'two') : '') +
        '<div class="hwrap">' +
        '<button class="tchip hist" data-act="history" aria-expanded="' +
        (state.trailOpen ? 'true' : 'false') + '">' +
        ICON.back + '<span class="t">History</span>' + ICON.caret + '</button>' +
        (state.trailOpen ? trailMenu(stops) : '') +
        '</div>';
    }

    function closeTrailMenu() {
      if (!state.trailOpen) return;
      state.trailOpen = false;
      renderTrail();
    }

    function renderResume() {
      var host = el('resume');
      if (!host) return;
      var row = resumeCandidate();
      if (!row) {
        host.hidden = true;
        host.innerHTML = '';
        return;
      }
      host.hidden = false;
      host.innerHTML =
        ICON.bookmark +
        '<p><b>Pick up where you left off:</b> <span class="doc">' + esc(clip(row.label, 46)) + '</span>' +
        ' - you were ' + Math.round(row.scroll * 100) + '% through' +
        (row.mark ? ', at ' + esc(row.mark) : '') + '.</p>' +
        '<button class="btn small" data-resume="' + esc(row.doc) + '">Resume reading</button>' +
        '<button class="btn ghost small" data-resume-off="' + esc(row.doc) + '">Dismiss</button>';
    }

    /* ---- Today ---- */

    function viewToday() {
      var d = state.data;
      var p = d.position;
      var c = counts();
      var tracked = d.projects.filter(function (x) { return !x['Same as']; });
      var done = tracked.filter(function (x) { return x.Status === 'Done'; }).length;
      var read = d.docs.filter(function (x) { return x.Status === 'Read'; }).length;

      var html;

      if (!p.started || p.day === null || p.day < 1) {
        // Day zero. The artwork carries the welcome, and its counts are right because nothing
        // has happened yet.
        html = '<img class="welcomehero" src="' + IMG.welcomeHero + '" alt="Welcome. Paid Search Analyst, hired for how you think, not what you already know.">';
      } else {
        // Once it is running the same hero is used blank, with the numbers rendered live over
        // it. Baked-in counts would start drifting the first time anything changed, and a
        // stale number on the landing page is exactly the habit this whole thing argues against.
        html =
          '<div class="hero" style="background-image:url(' + IMG.welcomeHeroBlank + ')">' +
          '<div class="hero-in">' +
          '<img class="medallion" src="' + phaseArt() + '" alt="">' +
          '<div class="hero-copy">' +
          '<div class="eyebrow">Brady Americas &middot; the 90-day ramp</div>' +
          '<h2>' + (d.displayName ? 'Welcome, ' + esc(d.displayName) + '.' : 'The ramp') + '</h2>' +
          '<p>' + esc(p.phase) + '. Day ' + p.day + ' of 90, from ' + esc(p.startDate) + '.</p>' +
          '<div class="hero-stats">' +
          '<span><b>' + tracked.length + '</b> projects</span>' +
          '<span><b>' + d.docs.length + '</b> documents</span>' +
          '<span><b>' + done + '</b> done so far</span>' +
          '</div></div></div></div>';
      }

      html += '<img class="rampstrip" src="' + IMG.rampStrip + '" alt="Learn, days 1 to 30, read-only. Assist, days 31 to 60, everything reviewed before it ships. Own, days 61 to 90, your accounts and your recommendations.">';

      // The reassurance card is specifically about month one, and it says so on its face.
      // It comes down when it stops being true.
      if (!p.started || p.day === null || p.day <= 30) {
        html += '<img class="welcomecard" src="' + IMG.welcomeCard + '" alt="Day one. Nobody expects you to know any of this yet. Month one is reading, watching and asking questions. You will not touch a live account in week one, and that is deliberate.">';
      }

      if (!p.started) {
        html +=
          '<div class="callout"><b>Set your start date.</b> Everything that counts days works ' +
          'from it, and nothing else on this page works until it is set.</div>' +
          '<div class="card"><div class="row">' +
          '<input type="date" id="startDate" style="max-width:220px" value="' + esc(p.startDate || '') + '">' +
          '<button class="btn" data-act="save-start">Save</button>' +
          '</div></div>';
      }

      html +=
        '<div class="grid">' +
        stat(IMG.statProjects, done + '<small> / ' + tracked.length + '</small>', 'Projects done', done / Math.max(tracked.length, 1)) +
        stat(IMG.statDocs, read + '<small> / ' + d.docs.length + '</small>', 'Documents read', read / Math.max(d.docs.length, 1)) +
        stat(IMG.statQuestions, c.questions, 'Questions open', null) +
        stat(IMG.statWrong, d.wrong.length, 'Things I got wrong', null) +
        '</div>';

      // Phase medals, once each threshold is behind her.
      var medals = [];
      if (p.started && p.day !== null) {
        if (p.day > 30) medals.push(['milestoneDay30', 'Day 30 - Learn complete']);
        if (p.day > 60) medals.push(['milestoneDay60', 'Day 60 - Assist complete']);
        if (p.day > 90) medals.push(['milestoneDay90', 'Day 90 - ramp complete']);
      }
      if (medals.length) {
        html += '<h3 class="group">Behind you</h3><div class="medals">' +
          medals.map(function (m) {
            return '<img src="' + IMG[m[0]] + '" alt="' + esc(m[1]) + '">';
          }).join('') + '</div>';
      }

      // This week
      var week = currentWeek();
      if (week) {
        var bands = WEEK_BANDS.filter(function (b) {
          return week >= b.from && week <= b.to;
        });
        html += '<h3 class="group">This week &middot; week ' + week + '</h3><div class="card">';
        if (bands.length) {
          html += '<dl class="week">' + bands.map(function (b) {
            return '<dt>Weeks ' + b.from + '-' + b.to + '</dt><dd><b>' + esc(b.phase) + '.</b> ' +
              esc(b.ladder) + ' <span style="color:var(--ink-3)">' + esc(b.alongside) + '</span></dd>';
          }).join('') + '</dl>';
        } else {
          html += '<p style="margin:0;color:var(--ink-2)">Past the thirteen weeks the ladder covers. ' +
            'What comes next is in the library under <b>After the ramp</b>.</p>';
        }
        var expect = deepDiveExpectation();
        if (expect) {
          html += '<div class="callout info" style="margin:16px 0 0"><b>At the Search Deep Dive right now:</b> ' + esc(expect) + '</div>';
        }
        html += '</div>';

        html += '<div class="meetings">' +
          MEETING_ART.map(function (key, i) {
            return '<img src="' + IMG[key] + '" alt="' + esc(MEETINGS[i][2]) + ' - ' + esc(MEETINGS[i][3]) + '">';
          }).join('') + '</div>' +
          '<div class="card tight plain" style="margin-top:10px"><div class="row">' +
          '<span class="chip blue">Fri 9:00</span><b style="font-weight:600">Professional development block</b>' +
          '<span style="color:var(--ink-3);font-size:12.5px">Two protected hours, held for learning rather than ' +
          'delivery. It is the first thing that gets eaten if you let it.</span></div></div>';
      }

      // The three lines
      html += '<h3 class="group">The three lines</h3>' + dailyCard();

      // In flight
      var inFlight = d.projects.filter(function (x) {
        return x.Status === 'In progress' || x.Status === 'Blocked' || x.Status === 'Ready for readout';
      });
      html += '<h3 class="group">In flight</h3>';
      html += inFlight.length
        ? inFlight.map(projectSummary).join('')
        : emptyState(IMG.emptyInflight, 'Nothing in progress. Pick the next one up from the ladder.');

      var nextUp = d.projects.filter(function (x) {
        return x.Status === 'Not started' && !x['Same as'];
      }).slice(0, 3);
      if (nextUp.length) {
        html += '<h3 class="group">Next up</h3>' + nextUp.map(projectSummary).join('');
      }

      var open = d.questions.filter(function (x) { return x.Status === 'Open'; }).slice(0, 5);
      if (open.length) {
        html += '<h3 class="group">Open questions</h3>' +
          open.map(function (q) {
            return '<div class="card tight plain"><div class="row">' +
              '<span class="chip mono">' + esc(q.ID) + '</span><b style="font-weight:600">' +
              esc(q.Question) + '</b></div></div>';
          }).join('');
      }

      return html;
    }

    function stat(icon, value, label, ratio) {
      return (
        '<div class="stat"><div class="row" style="gap:12px;align-items:flex-start">' +
        '<img src="' + icon + '" alt="" style="width:38px;height:38px;flex:0 0 auto">' +
        '<div style="flex:1"><div class="n">' + value + '</div><div class="k">' + esc(label) + '</div></div>' +
        '</div>' +
        (ratio === null ? '' : '<div class="meter"><i style="width:' + Math.round(ratio * 100) + '%"></i></div>') +
        '</div>'
      );
    }

    function emptyState(image, message) {
      return '<div class="empty"><img src="' + image + '" alt="" style="max-width:300px;width:100%;margin-bottom:6px">' +
        '<div>' + esc(message) + '</div></div>';
    }

    function projectSummary(p) {
      return (
        '<div class="card tight plain"><div class="row">' +
        '<span class="idbadge">' + esc(p.ID) + '</span>' +
        '<b style="font-weight:600">' + esc(p.Project) + '</b>' +
        '<span style="color:var(--ink-3);font-size:12.5px">' + esc(p.Account) + '</span>' +
        '<span class="' + chipFor(p.Status) + ' push">' + esc(p.Status) + '</span>' +
        '<button class="btn ghost small" data-goto-project="' + esc(p.ID) + '">Open</button>' +
        '</div></div>'
      );
    }

    /** Today's three lines, editable in place. One row per day - this edits today's rather
     *  than stacking a second one. */
    function dailyCard() {
      var todayRow = state.data.daily.filter(function (r) {
        return r.Date === state.data.today;
      })[0];

      var body =
        '<div class="cols">' +
        field('What you worked on', '<textarea id="dWorked" style="min-height:62px">' + esc(todayRow ? todayRow['Worked on'] : '') + '</textarea>') +
        field('One thing you learned', '<textarea id="dLearned" style="min-height:62px">' + esc(todayRow ? todayRow.Learned : '') + '</textarea>') +
        field('One thing that surprised you', '<textarea id="dSurprised" style="min-height:62px">' + esc(todayRow ? todayRow['Surprised me'] : '') + '</textarea>') +
        '</div>' +
        '<div class="row">' +
        '<button class="btn" data-act="save-daily">' + (todayRow ? 'Update' : 'Save') + '</button>' +
        '<button class="btn ghost" data-act="copy-daily">Copy for chat</button>' +
        (todayRow ? '<span class="chip mono">' + esc(todayRow.ID) + '</span>' : '') +
        '<label class="row tight push" style="font-size:12.5px;color:var(--ink-2)">' +
        '<input type="checkbox" id="dKeepKill" style="width:auto"' +
        (todayRow && todayRow['Keep/Kill done'] === 'Yes' ? ' checked' : '') + '> Keep/Kill review done</label>' +
        '</div>' +
        '<p style="margin:10px 0 0;color:var(--ink-3);font-size:12.5px">Two minutes, before you log off. ' +
        'It is not a status report - the third line is the useful one.</p>';

      return '<div class="card">' + body + '</div>';
    }

    /* ---- Library ---- */

    function libraryDocs() {
      var needle = state.libraryFilter.toLowerCase();
      return state.data.docs
        .slice()
        .sort(function (a, b) {
          return Number(a.Order) - Number(b.Order);
        })
        .filter(function (d) {
          if (state.libraryFolder !== 'All' && d.Folder !== state.libraryFolder) return false;
          if (!needle) return true;
          return (d.Title + ' ' + d.Summary + ' ' + d['Source file']).toLowerCase().indexOf(needle) !== -1;
        });
    }

    function libraryListHtml() {
      var shown = libraryDocs();
      if (!shown.length) {
        return '<div class="empty" style="margin:20px;border:0">Nothing matches that. ' +
          '<button class="btn ghost small" data-act="search-full">Search inside the documents</button></div>';
      }

      var html = '';
      var lastFolder = null;
      shown.forEach(function (d) {
        if (d.Folder !== lastFolder) {
          // Text, not the folder artwork. Those banners are 1386px wide with type set for it;
          // in a 336px column they scale to a quarter size and stop being readable. They are
          // used in the reader instead, where there is room for them.
          html += '<div class="folder">' + esc(d.Folder) + '</div>';
          lastFolder = d.Folder;
        }
        html +=
          '<button data-doc="' + esc(d.ID) + '" aria-current="' + (state.openDoc === d.ID) + '">' +
          '<span class="t">' + esc(d.Title) + '</span>' +
          '<span class="s">' + esc(d.Summary || d['Source file']) + '</span>' +
          '<span class="row tight" style="margin-top:7px">' +
          '<span class="' + chipFor(d.Status) + '">' + esc(d.Status) + '</span>' +
          '<span class="chip mono">' + esc(d.Words) + ' words</span>' +
          '</span></button>';
      });
      return html;
    }

    function refreshLibraryList() {
      var node = el('liblist');
      if (node) node.innerHTML = libraryListHtml();
    }

    function viewLibrary() {
      var folders = ['All'];
      state.data.docs.forEach(function (d) {
        if (folders.indexOf(d.Folder) === -1) folders.push(d.Folder);
      });

      return (
        '<div class="libnav">' +
        '<div class="filters">' +
        '<input type="search" id="libSearch" placeholder="Filter by title" value="' + esc(state.libraryFilter) + '">' +
        '<select id="libFolder">' + options(folders, state.libraryFolder) + '</select>' +
        '</div>' +
        '<div class="liblist" id="liblist">' + libraryListHtml() + '</div>' +
        '</div>' +
        '<div class="reader" id="reader">' + readerHtml() + '</div>'
      );
    }

    function readerHtml() {
      if (!state.openDoc) {
        return '<div class="empty" style="margin:60px;border:0;background:none">' +
          'Pick something from the list to read it.<br><br>' +
          '<span style="font-size:12.5px">Press <b>Ctrl</b> or <b>Cmd</b> + <b>K</b> to jump straight to anything.</span></div>';
      }
      var meta = state.index[state.openDoc];
      var doc = state.docCache[state.openDoc];
      if (!doc) return '<div class="loading">Loading...</div>';

      var linked = state.data.projects.filter(function (p) {
        return p['Doc ID'] === state.openDoc;
      });
      var diagram = diagramFor(state.openDoc);

      return (
        '<div class="head">' +
        '<h3>' + esc(meta.Title) + '</h3>' +
        (meta.Status === 'Read' ? '<img class="readstamp" src="' + IMG.stampRead + '" alt="Read">' : '') +
        '<span class="chip">' + esc(meta.Folder) + '</span>' +
        (linked.length
          ? linked.map(function (p) {
              return '<button class="chip blue" data-goto-project="' + esc(p.ID) + '" style="border:0">' + esc(p.ID) + '</button>';
            }).join('')
          : '') +
        '<div class="push row tight">' +
        '<select id="docStatus" style="width:auto">' + options(state.data.lists.DocStatus, meta.Status) + '</select>' +
        '</div></div>' +
        '<div class="scroll">' +
        (FOLDER_ART[meta.Folder] && IMG[FOLDER_ART[meta.Folder]]
          ? '<img class="folderbanner" src="' + IMG[FOLDER_ART[meta.Folder]] + '" alt="' + esc(meta.Folder) + '">'
          : '') +
        (diagram
          ? '<img class="diagram" src="' + diagram + '" alt="Concept diagram for ' + esc(meta.Title) + '">'
          : '') +
        '<div class="md">' + renderMarkdown(doc.Body, { docId: state.openDoc, index: state.index }) + '</div>' +
        '<hr>' +
        field('My notes on this', '<textarea id="docNotes" placeholder="What you want to remember, or what did not make sense">' + esc(meta['My notes'] || '') + '</textarea>') +
        '</div>'
      );
    }

    /* ---- The ladder ---- */

    var TIER_ART = {
      'Tier 1': 'tierT1', 'Tier 2': 'tierT2', 'Tier 3': 'tierT3', 'Tier 4': 'tierT4', Mecco: 'tierM'
    };

    function viewLadder() {
      var d = state.data;
      var byTier = {};
      d.projects.slice().sort(function (a, b) {
        return Number(a.Order) - Number(b.Order);
      }).forEach(function (p) {
        (byTier[p.Tier] = byTier[p.Tier] || []).push(p);
      });

      var html =
        '<div class="page-head"><h2 class="page">The ladder</h2>' +
        '<p class="lede">Thirty-three projects across five tiers. They start at about an hour and grow to ' +
        'week-long by the end, and the length is part of what is being trained.</p></div>';

      ['Tier 1', 'Tier 2', 'Tier 3', 'Mecco', 'Tier 4'].forEach(function (tier) {
        var rows = byTier[tier] || [];
        if (!rows.length) return;
        var tracked = rows.filter(function (p) { return !p['Same as']; });
        var done = tracked.filter(function (p) { return p.Status === 'Done'; }).length;

        html +=
          '<div class="tierhead">' +
          '<img src="' + IMG[TIER_ART[tier]] + '" alt="">' +
          '<div><b>' + esc(tier) + '</b>' +
          '<span>' + esc(rows[0].Window) + ' &middot; ' + esc(rows[0].Safety) + '</span></div>' +
          '<div class="push row tight"><span class="chip mono">' + done + ' of ' + tracked.length + ' done</span></div>' +
          '</div>';
        html += rows.map(projectRow).join('');
      });

      return html;
    }

    function projectRow(p) {
      var isOpen = state.openProject === p.ID;
      var alias = p['Same as'];

      var head =
        '<div class="top">' +
        '<span class="idbadge">' + esc(p.ID) + '</span>' +
        '<span class="title"><b>' + esc(p.Project) + '</b>' +
        '<span class="meta">' + esc(p.Account) + ' &middot; ' + esc(p.Mode) + ' &middot; ' + esc(p['Time box']) +
        (p['Goes live'] === 'Yes' ? '</span></span><span class="chip amber">goes live</span><span style="display:none">' : '') +
        '</span></span>' +
        (alias
          ? '<span class="chip">same as ' + esc(alias) + '</span>'
          : '<span class="' + chipFor(p.Status) + '">' + esc(p.Status) + '</span>') +
        '<button class="btn quiet small" data-toggle-project="' + esc(p.ID) + '">' +
        (isOpen ? 'Close' : 'Open') + '</button>' +
        '</div>';

      if (!isOpen) return '<div class="proj' + (alias ? ' alias' : '') + '">' + head + '</div>';

      if (alias) {
        return '<div class="proj alias open">' + head +
          '<div class="detail"><p style="margin:0">This is the same project as <b>' + esc(alias) +
          '</b>. It sits here so the ladder reads correctly - track it on ' + esc(alias) + '.</p></div></div>';
      }

      var linkedQ = state.data.questions.filter(function (q) { return q.Project === p.ID; });
      var linkedW = state.data.wrong.filter(function (w) { return w.Project === p.ID; });
      var linkedN = state.data.notes.filter(function (n) { return n.Project === p.ID; });

      // The designed stamps and badges live here, in the detail panel, where there is room for
      // them. List rows keep the compact CSS chips so twelve projects in a row stay one rhythm.
      var stampKey = STATUS_STAMP[p.Status];
      var accountKey = ACCOUNT_ART[p.Account];

      var detail =
        '<div class="detail">' +
        '<div class="stamprow">' +
        (stampKey ? '<img class="stamp" src="' + IMG[stampKey] + '" alt="' + esc(p.Status) + '">' : '') +
        (p.Safety === 'Read-only' ? '<img class="stamp" src="' + IMG.badgeReadOnly + '" alt="Read-only">' : '') +
        '<img class="stamp" src="' + IMG[p.Mode === 'Paired' ? 'badgePaired' : 'badgeSolo'] + '" alt="' + esc(p.Mode) + '">' +
        '<img class="stamp" src="' + IMG.badgeTimebox + '" alt="Time-boxed">' +
        '<span class="chip mono">' + esc(p['Time box']) + '</span>' +
        '</div>' +
        (accountKey ? '<img class="accountbadge" src="' + IMG[accountKey] + '" alt="' + esc(p.Account) + '">' : '') +
        '<p style="margin:0 0 14px"><b>Deliverable:</b> ' + esc(p.Deliverable) + '</p>';

      // The prediction. Written before anything is opened, or it is not a prediction.
      if (p.Prediction) {
        detail +=
          '<div class="prediction"><div class="k">Predicted' +
          (p['Predicted on'] ? ' on ' + esc(p['Predicted on']) : '') + '</div>' +
          '<p>' + esc(p.Prediction) + '</p></div>';
      } else {
        detail +=
          '<div class="prediction"><div class="k">Before you open anything</div>' +
          '<p style="margin-bottom:10px">Write what you think the answer is. Thirty seconds, two or three lines. ' +
          '"I have no idea" is a legitimate prediction - it makes the gap visible later, which is the point.</p>' +
          '<textarea data-project="' + esc(p.ID) + '" data-f="Prediction" placeholder="What do you expect to find?"></textarea></div>';
      }

      detail +=
        '<div class="cols">' +
        field('Status', '<select data-project="' + esc(p.ID) + '" data-f="Status">' + options(state.data.lists.ProjectStatus, p.Status) + '</select>') +
        field('Started', '<input type="date" data-project="' + esc(p.ID) + '" data-f="Started" value="' + esc(p.Started) + '">') +
        field('Finished', '<input type="date" data-project="' + esc(p.ID) + '" data-f="Finished" value="' + esc(p.Finished) + '">') +
        field('Hours', '<input type="number" step="0.25" min="0" data-project="' + esc(p.ID) + '" data-f="Hours" value="' + esc(p.Hours) + '">') +
        field('Did the timebox hold?', '<select data-project="' + esc(p.ID) + '" data-f="Timebox held"><option value=""></option>' + options(state.data.lists.Timebox, p['Timebox held']) + '</select>') +
        '</div>' +
        field('Where the deliverable lives', '<input type="text" data-project="' + esc(p.ID) + '" data-f="Deliverable link" placeholder="A link, or where you filed it" value="' + esc(p['Deliverable link']) + '">') +
        field('Notes', '<textarea data-project="' + esc(p.ID) + '" data-f="Notes">' + esc(p.Notes) + '</textarea>') +
        '<div class="row">' +
        (p['Doc ID'] ? '<button class="btn ghost small" data-doc="' + esc(p['Doc ID']) + '">Read the brief</button>' : '') +
        '<button class="btn ghost small" data-readout="' + esc(p.ID) + '">Build the readout</button>' +
        '<button class="btn ghost small" data-logwrong="' + esc(p.ID) + '">Log what I got wrong</button>' +
        '</div>';

      if (linkedQ.length || linkedW.length || linkedN.length) {
        detail += '<div class="linked"><div class="k" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:8px">Filed against this project</div><div class="row tight">' +
          linkedQ.map(function (q) { return '<span class="chip red">' + esc(q.ID) + ' question</span>'; }).join('') +
          linkedW.map(function (w) { return '<span class="chip amber">' + esc(w.ID) + ' got wrong</span>'; }).join('') +
          linkedN.map(function (n) { return '<span class="chip">' + esc(n.ID) + ' note</span>'; }).join('') +
          '</div></div>';
      }

      detail += '</div>';
      return '<div class="proj open">' + head + detail + '</div>';
    }

    /* ---- log tables ---- */

    function entryHead(id, chips, date, section) {
      return '<div class="head"><span class="chip mono">' + esc(id) + '</span>' + chips +
        '<span style="color:var(--ink-3);font-size:12px">' + esc(date) + '</span>' +
        '<div class="push row tight">' +
        '<button class="btn quiet small" data-edit="' + section + '|' + esc(id) + '">Edit</button>' +
        '<button class="btn danger small" data-del="' + section + '" data-id="' + esc(id) + '">Delete</button>' +
        '</div></div>';
    }

    function viewQuestions() {
      var rows = state.data.questions.slice().reverse();
      var html =
        '<div class="page-head"><h2 class="page">Questions</h2>' +
        '<p class="lede">Your running list of things you do not understand yet. It is meant to get long. ' +
        'When you can answer one, write the answer in rather than deleting the question.</p></div>' +
        '<div class="card">' +
        field('Ask something', '<textarea id="qNew" placeholder="What do you not understand yet?"></textarea>') +
        '<div class="cols">' +
        field('Context, if it helps', '<input type="text" id="qContext" placeholder="Where it came up">') +
        field('Project', projectSelect('qProject', '')) +
        '</div>' +
        '<button class="btn" data-act="add-question">Add it</button>' +
        '</div>';

      if (!rows.length) return html + emptyState(IMG.emptyQuestions, 'Nothing yet. Start this on day one.');

      html += rows.map(function (q) {
        if (state.editing === 'questions|' + q.ID) return editQuestion(q);
        return (
          '<div class="entry">' +
          entryHead(q.ID, '<span class="' + chipFor(q.Status) + '">' + esc(q.Status) + '</span>' +
            (q.Project ? '<span class="chip blue">' + esc(q.Project) + '</span>' : ''), q['Asked on'], 'questions') +
          '<div class="q">' + nl2br(q.Question) + '</div>' +
          (q.Context ? '<p style="color:var(--ink-3);font-size:12.5px;margin:6px 0 0">' + esc(q.Context) + '</p>' : '') +
          (q.Answer
            ? '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--hairline-soft)">' +
              '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.085em;color:var(--ink-3);margin-bottom:4px">Answer' +
              (q['Answered on'] ? ' &middot; ' + esc(q['Answered on']) : '') + '</div>' +
              '<div>' + nl2br(q.Answer) + '</div></div>'
            : '<div class="row" style="margin-top:12px">' +
              '<button class="btn ghost small" data-edit="questions|' + esc(q.ID) + '">Answer it</button></div>') +
          '</div>'
        );
      }).join('');

      return html;
    }

    function editQuestion(q) {
      return (
        '<div class="entry">' +
        '<div class="head"><span class="chip mono">' + esc(q.ID) + '</span><b>Editing</b></div>' +
        field('Question', '<textarea data-e="Question">' + esc(q.Question) + '</textarea>') +
        field('Context', '<input type="text" data-e="Context" value="' + esc(q.Context) + '">') +
        field('Answer', '<textarea data-e="Answer" placeholder="Write it when you have it">' + esc(q.Answer) + '</textarea>') +
        '<div class="cols">' +
        field('Status', '<select data-e="Status">' + options(state.data.lists.QuestionStatus, q.Status) + '</select>') +
        field('Project', projectSelect(null, q.Project, 'Project')) +
        field('Answered by', '<input type="text" data-e="Answered by" value="' + esc(q['Answered by']) + '">') +
        '</div>' +
        '<div class="row"><button class="btn" data-save="questions|' + esc(q.ID) + '">Save</button>' +
        '<button class="btn quiet" data-act="cancel-edit">Cancel</button></div>' +
        '</div>'
      );
    }

    function viewWrong() {
      var rows = state.data.wrong.slice().reverse();
      var html =
        '<div class="page-head"><h2 class="page">What I got wrong</h2>' +
        '<p class="lede">One line per surprise, all ninety days. Nobody reads this but you, and the blunter ' +
        'it is the more it is worth. The last box earns its place: the gap is data, the habit behind it is ' +
        'the lesson.</p></div>' +
        '<div class="card">' +
        field('Project', projectSelect('wProject', '')) +
        field('I predicted', '<textarea id="wPredicted"></textarea>') +
        field('What actually happened', '<textarea id="wActual"></textarea>') +
        field('Why I was off', '<textarea id="wWhy"></textarea>') +
        field('The habit to watch', '<textarea id="wHabit" placeholder="The pattern behind it, not just this one"></textarea>') +
        '<button class="btn" data-act="add-wrong">Add it</button>' +
        '</div>';

      if (!rows.length) {
        return html + emptyState(IMG.emptyWrong, 'Nothing yet. A long list here at day 90 is a good outcome.');
      }

      html += rows.map(function (w) {
        if (state.editing === 'wrong|' + w.ID) return editWrong(w);
        return (
          '<div class="entry">' +
          entryHead(w.ID, w.Project ? '<span class="chip blue">' + esc(w.Project) + '</span>' : '', w.Date, 'wrong') +
          '<dl>' +
          '<dt>Predicted</dt><dd>' + nl2br(w['I predicted']) + '</dd>' +
          '<dt>Actually</dt><dd>' + nl2br(w['What actually happened']) + '</dd>' +
          (w['Why I was off'] ? '<dt>Why</dt><dd>' + nl2br(w['Why I was off']) + '</dd>' : '') +
          (w['Habit to watch'] ? '<dt>Habit</dt><dd class="habit">' + nl2br(w['Habit to watch']) + '</dd>' : '') +
          '</dl></div>'
        );
      }).join('');

      return html;
    }

    function editWrong(w) {
      return (
        '<div class="entry">' +
        '<div class="head"><span class="chip mono">' + esc(w.ID) + '</span><b>Editing</b></div>' +
        field('Project', projectSelect(null, w.Project, 'Project')) +
        field('I predicted', '<textarea data-e="I predicted">' + esc(w['I predicted']) + '</textarea>') +
        field('What actually happened', '<textarea data-e="What actually happened">' + esc(w['What actually happened']) + '</textarea>') +
        field('Why I was off', '<textarea data-e="Why I was off">' + esc(w['Why I was off']) + '</textarea>') +
        field('The habit to watch', '<textarea data-e="Habit to watch">' + esc(w['Habit to watch']) + '</textarea>') +
        '<div class="row"><button class="btn" data-save="wrong|' + esc(w.ID) + '">Save</button>' +
        '<button class="btn quiet" data-act="cancel-edit">Cancel</button></div>' +
        '</div>'
      );
    }

    function viewNotes() {
      var rows = state.data.notes.slice().reverse();
      var html =
        '<div class="page-head"><h2 class="page">Notes</h2>' +
        '<p class="lede">Meetings, capture sessions, things people told you. Write them down the same day - ' +
        'especially in the first three weeks, when a lot of what you are told only exists in someone’s ' +
        'head.</p></div>' +
        '<div class="card">' +
        '<div class="cols">' +
        field('Kind', '<select id="nKind">' + options(state.data.lists.NoteKind, 'Capture') + '</select>') +
        field('Title', '<input type="text" id="nTitle" placeholder="What it was">') +
        field('Who', '<input type="text" id="nWho" placeholder="Who was there">') +
        field('Project', projectSelect('nProject', '')) +
        '</div>' +
        field('The note', '<textarea id="nBody"></textarea>') +
        field('Follow-up, if any', '<input type="text" id="nFollow" placeholder="What you owe someone, or what to chase">') +
        '<button class="btn" data-act="add-note">Add it</button>' +
        '</div>';

      if (!rows.length) return html + emptyState(IMG.emptyNotes, 'Nothing yet.');

      html += rows.map(function (n) {
        if (state.editing === 'notes|' + n.ID) return editNote(n);
        return (
          '<div class="entry">' +

    /* ---- Self-assessment ---- */

    var SCORE_RANK = { 'Not yet': 0, Developing: 1, Independent: 2 };

    function viewSkills() {
      var rows = state.data.skills.slice().sort(function (a, b) {
        return Number(a.Order) - Number(b.Order);
      });

      // The Reference group in the rail is text-only, so this icon earns its place here

      var html =
        '<div class="page-head titled">' +
        '<img class="pageicon" src="' + IMG.navSkills + '" alt="">' +
        '<div><h2 class="page">Self-assessment</h2>' +
        '<p class="lede">Rate yourself before any training starts, then again at day 30 and day 90. It is ' +
        'not a test and nobody else scores it - its only job is to show you how far you moved.</p></div></div>' +
        '<div class="callout"><b>Some scores will go down at day 30, and that is the training working.</b> ' +
        'On things you have not learned yet, a day-one rating is usually too high - you cannot see the shape ' +
        'of something you have not learned. Measurement and attribution is where this hits hardest.</div>';

      var scored = rows.filter(function (s) { return s['Day 1'] && s['Day 90']; });
      if (scored.length) {
        var up = scored.filter(function (s) { return SCORE_RANK[s['Day 90']] > SCORE_RANK[s['Day 1']]; }).length;
        var down = scored.filter(function (s) { return SCORE_RANK[s['Day 90']] < SCORE_RANK[s['Day 1']]; }).length;
        html += '<div class="grid" style="margin-bottom:24px">' +
          stat(IMG.statSelfAssess, up, 'Moved up by day 90', null) +
          stat(IMG.statSelfAssess, scored.length - up - down, 'Held', null) +
          stat(IMG.statSelfAssess, down, 'Moved down', null) +
          '</div>';
      }

      var lastSection = null;
      var open = false;
      rows.forEach(function (s) {
        if (s.Section !== lastSection) {
          if (open) html += '</tbody></table>';
          html +=
            '<h3 class="group">' + esc(s.Section) + '</h3>' +
            '<table class="data"><thead><tr><th class="wide">Skill</th><th>Day 1</th><th>Day 30</th>' +
            '<th>Day 90</th><th>Movement</th><th>Evidence</th></tr></thead><tbody>';
          lastSection = s.Section;
          open = true;
        }
        html +=
          '<tr><td>' + esc(s.Skill) + '</td>' +
          ['Day 1', 'Day 30', 'Day 90'].map(function (f) {
            return '<td><select data-skill="' + esc(s.ID) + '" data-f="' + f + '">' +
              '<option value=""></option>' + options(state.data.lists.Score, s[f]) + '</select></td>';
          }).join('') +
          '<td>' + movement(s) + '</td>' +
          '<td><input type="text" data-skill="' + esc(s.ID) + '" data-f="Evidence" value="' + esc(s.Evidence) + '" placeholder="What proves it"></td></tr>';
      });
      if (open) html += '</tbody></table>';

      return html;
    }

    function movement(s) {
      var from = s['Day 1'];
      var to = s['Day 90'] || s['Day 30'];
      if (!from || !to) return '<span class="movement flat">-</span>';
      var delta = SCORE_RANK[to] - SCORE_RANK[from];
      if (delta > 0) return '<span class="movement up">up ' + delta + '</span>';
      if (delta < 0) return '<span class="movement down">down ' + Math.abs(delta) + '</span>';
      return '<span class="movement flat">held</span>';
    }

    function highlight(text, needle) {
      var safe = esc(text);
      if (!needle) return safe;
      var pattern = esc(needle).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return safe.replace(new RegExp('(' + pattern + ')', 'ig'), '<mark>$1</mark>');
    }

    /* ============================== rendering ============================== */

    var VIEW_FNS = {
      today: viewToday, library: viewLibrary, ladder: viewLadder,
      questions: viewQuestions, wrong: viewWrong, notes: viewNotes, daily: viewDaily,
      systems: viewSystems, scripts: viewScripts, skills: viewSkills, search: viewSearch

    function render() {
      // Where the outgoing document had got to, read while it is still on screen. The state
      // has already moved on by now, but the stack has not - its head is still the place being
      // left, which is exactly the row the position belongs to.
      noteScroll();
      pushTrail();

      var main = el('main');
      var split = state.view === 'library';
      main.className = 'main' + (split ? ' split' : '');
      var body = (VIEW_FNS[state.view] || viewToday)();
      main.innerHTML = split ? body : '<div class="wrap">' + body + '</div>';
      renderNav();
      renderHeader();
      renderCrumbs();
      renderTrail();
      renderResume();
      if (!split) main.scrollTop = 0;
      restoreScroll();
    }

    function refreshDoc(id) {
      render();
      if (state.docCache[id]) return;
      call('apiGetDoc', id)
        .then(function (doc) {
          state.docCache[id] = doc;
          if (state.openDoc === id) render();
        })
        .catch(function (e) {
          toast(e, true);
        });
    }

    function openDoc(id) {
      if (!state.index[id]) {
        toast('That document is not in the library.', true);
        return;
      }
      closeModal();
      state.view = 'library';
      state.openDoc = id;
      refreshDoc(id);
    }

    function gotoProject(id) {
      closeModal();
      state.view = 'ladder';
      state.openProject = id;
      render();
      var node = document.querySelector('[data-toggle-project="' + id + '"]');
      if (node && node.scrollIntoView) node.scrollIntoView({ block: 'center' });
    }

    function replaceRow(list, row, key) {
      for (var i = 0; i < list.length; i++) {
        if (list[i][key] === row[key]) {
          list[i] = row;
          return;
        }
      }
      list.push(row);
    }

    function reload(section, then) {
      return call('apiReload', section).then(function (rows) {
        state.data[section] = rows;
        if (then) then();
        render();
      });
    }

    /* ============================== command palette ============================== */

    function paletteItems() {
      var items = [];
