<!-- The whole interface. Apps Script serves one page; everything below is drawn by JavaScript.html. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <title>The ramp</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <?!= include('Stylesheet'); ?>
  </head>

  <body>
    <div class="app">
      <header class="topbar">
        <h1 class="brand" id="brand"></h1>

        <div class="app-switcher" role="tablist" aria-label="Application Mode">
          <button class="switcher-btn active" data-app="academy" role="tab" aria-selected="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
            <span>Academy</span>
          </button>
          <button class="switcher-btn" data-app="simulator" role="tab" aria-selected="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>Simulator</span>
          </button>
          <button class="switcher-btn" data-app="scorecard" role="tab" aria-selected="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
            <span>Scorecard</span>
          </button>
        </div>

        <div class="daychip" id="daychip" hidden>
          <b id="dayNumber">-</b><span id="dayPhase"></span>
        </div>

        <!-- Where you are. Takes the slack in the bar, and truncates before anything else does. -->
        <nav class="crumbs" id="crumbs" aria-label="You are here"></nav>

        <!-- Where you were: the last two stops, and the History dropdown behind them. -->
        <div class="trail" id="trail"></div>

        <button class="searchcue" data-act="palette" aria-label="Jump to anything">
          <span>Jump to anything</span><kbd>Ctrl K</kbd>
        </button>
        <button class="ghost-light" data-act="oneonone">1:1 prep</button>
        <div class="who" id="whoami"></div>
      </header>

      <!-- What you left unfinished. Empty and hidden unless there is something to come back to. -->
      <div class="resume" id="resume" role="region" aria-label="Resume reading" hidden></div>

      <div class="body app-module" id="academyApp">
        <nav class="nav" id="nav" aria-label="Sections"></nav>
        <main class="main" id="main">
          <div class="loading">Loading the workbook...</div>
        </main>
      </div>

      <div class="body app-module" id="simulatorApp" hidden style="padding: 0; background: #0f172a;">
        <iframe id="simulatorFrame" src="sim.html" style="width: 100%; height: 100%; border: none;"></iframe>
      </div>

      <div class="body app-module" id="scorecardApp" hidden>
        <main class="main" style="max-width: 800px; margin: 40px auto;">
          <h1>Analyst Scorecard</h1>
          <p>Automated grading engine coming soon.</p>
        </main>
      </div>
    </div>

    <div id="modalHost" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <?!= include('Images'); ?>
    <?!= include('JavaScript'); ?>
  </body>
</html>
