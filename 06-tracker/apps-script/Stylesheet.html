<style>
  /*
   * Brady Blue #002D72, Montserrat, WCAG AA, no emoji in the interface.
   *
   * Two decisions drive the rest of this sheet:
   *
   * 1. Blue is the anchor, not the flood. It holds the rail and the headings and nothing
   *    else, so that when something IS blue it means something. The page ground is a warm
   *    off-white and the working surfaces are white.
   *
   * 2. The reader is the primary surface. Most of the time spent in here is spent reading
   *    long-form material, so the reader gets a real measure (68 characters), real leading
   *    (1.75) and 16px type. Everything else is chrome around that.
   *
   * Status is always carried by a word as well as a colour. Colour alone fails anyone who
   * cannot separate the two, and it fails everyone in a printed screenshot.
   */

  :root {
    /* Brand */
    --navy: #002D72;
    --navy-600: #0B3E8F;
    --navy-100: #D7E3F7;
    --navy-50: #EEF3FC;

    /* Ink */
    --ink: #14171A;
    --ink-2: #4A5158;
    --ink-3: #767E88;

    /* Surfaces */
    --paper: #FFFFFF;
    --ground: #F6F7F9;
    --hairline: #E3E6EB;
    --hairline-soft: #EDEFF3;

    /* Accent. The kit's orange, and the only place it appears in the chrome - "back to where
       you were" has to read as a different move from "go somewhere new", and a second navy
       cannot do that. At full strength it clears AA on the navy bar (4.5:1) but not on a warm
       white (2.6:1), so text on the tints uses the darkened one instead. */
    --accent: #FF6B00;
    --accent-ink: #B34700;
    --accent-tint: #FFF3E8;
    --accent-tint-2: #FFEBD9;
    --accent-line: #FFD4AD;

    /* Status */
    --green: #0A6B4C;
    --green-bg: #E6F3EE;
    --amber: #7C5800;
    --amber-bg: #FBF2D9;
    --red: #97231D;
    --red-bg: #FBEAE8;
    --grey: #5C646D;
    --grey-bg: #EFF1F4;

    /* Rhythm */
    --r-sm: 6px;
    --r: 10px;
    --r-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(20, 23, 26, .05);
    --shadow: 0 1px 3px rgba(20, 23, 26, .06), 0 8px 24px -12px rgba(20, 23, 26, .12);
    --shadow-lg: 0 4px 12px rgba(20, 23, 26, .08), 0 24px 60px -20px rgba(20, 23, 26, .22);
    --ease: cubic-bezier(.2, .6, .3, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--ground);
    color: var(--ink);
    font-family: Montserrat, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-variant-numeric: tabular-nums;
  }

  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }

  :focus-visible {
    outline: 2px solid var(--navy-600);
    outline-offset: 2px;
    border-radius: var(--r-sm);
  }

  ::selection { background: var(--navy-100); }

  /* ============================== shell ============================== */

  .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* Segmented Mode Switcher Pill */
  .app-switcher {
    display: flex; align-items: center; gap: 3px;
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 999px; padding: 3px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    flex: 0 0 auto; margin-left: 6px; margin-right: 10px;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
  }

  .switcher-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: none; outline: none;
    color: #9FB6DD; padding: 5px 14px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.01em;
    border-radius: 999px; cursor: pointer;
    transition: all 0.2s var(--ease);
  }
  .switcher-btn svg { opacity: 0.75; transition: opacity 0.2s var(--ease); }
  .switcher-btn:hover { color: #ffffff; background: rgba(255, 255, 255, 0.1); }
  .switcher-btn:hover svg { opacity: 1; }

  .switcher-btn.active {
    background: var(--accent); color: #ffffff; font-weight: 700;
    box-shadow: 0 2px 10px rgba(255, 107, 0, 0.4);
  }
  .switcher-btn.active svg { opacity: 1; stroke-width: 2.5; }

  .app-module {
    flex: 1 1 auto; height: calc(100vh - 58px);
    opacity: 1; transition: opacity 0.18s var(--ease);
  }
  .app-module.fade-out { opacity: 0; }


  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 0 22px; height: 58px; flex: 0 0 auto;
    background: var(--navy); color: #fff;
  }
  /* Everything in the bar except the breadcrumb and the trail holds its size. Left to shrink,
     these wrap onto a second line inside a 58px bar rather than getting narrower. */
  .brand, .daychip, .searchcue, .topbar .ghost-light { flex: 0 0 auto; white-space: nowrap; }

  .brand {
    display: flex; align-items: center; gap: 12px;
    font-size: 15px; font-weight: 700; letter-spacing: .015em;
    margin: 0;
  }
  /* The wordmark is a single flat colour, so reversing it out to white is a filter rather
     than a second asset. If Brady publishes an official reversed lockup, use that instead. */
  .brand .logo { height: 21px; width: auto; filter: brightness(0) invert(1); opacity: .95; }
  .brand .rule { width: 1px; height: 20px; background: rgba(255, 255, 255, .28); }
  .brand .wordmark { font-weight: 700; }
  .brand .sub { font-weight: 400; opacity: .62; }

  .daychip {
    display: flex; align-items: baseline; gap: 9px;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 999px; padding: 5px 15px;
  }
  .daychip b { font-size: 14px; font-weight: 700; letter-spacing: .01em; }
  .daychip span { font-size: 11.5px; opacity: .82; }

  .who { flex: 0 0 auto; color: #9FB6DD; font-size: 12.5px; white-space: nowrap; }

  /* ====================== where you are, where you were ======================

     The breadcrumb says where you are, the trail chips say where you were, and the resume
     banner says what you left unfinished. All three read from one stack; the code that keeps
     it is in JavaScript.html.

     The breadcrumb is the only thing in the bar that takes the slack, and the only thing that
     truncates, so a long document title never pushes the way back off the edge. */

  /* The breadcrumb takes the slack in the bar, and gives it up first: when the two compete,
     the chips win. The document title is already set in the reader head immediately below,
     so a truncated breadcrumb costs nothing - a truncated chip has nowhere else to be read. */
  .crumbs {
    flex: 1 4 auto; min-width: 180px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: #9FB6DD;
  }
  .crumbs .pin { flex: 0 0 auto; width: 12px; height: 14px; color: var(--accent); }
  .crumbs .sep { flex: 0 0 auto; opacity: .55; }
  .crumbs .seg {
    flex: 0 0 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Only the last segment truncates. A folder name clipped to "Le..." is worse than no folder
     name, so the ones in front of it drop out whole, on the breakpoint below. */
  .crumbs .now { flex: 0 1 auto; min-width: 84px; color: #fff; font-weight: 700; }

  .trail { display: flex; align-items: center; gap: 8px; flex: 0 1 auto; min-width: 0; }
  .trail .lbl {
    font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: #9FB6DD; white-space: nowrap;
  }

  .tchip {
    display: flex; align-items: center; gap: 7px; min-width: 0; max-width: 230px;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .2);
    color: #C9D7EF; border-radius: 999px; padding: 5px 14px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
    transition: background .13s var(--ease), border-color .13s var(--ease), color .13s var(--ease);
  }
  .tchip .t { overflow: hidden; text-overflow: ellipsis; }
  .tchip svg { flex: 0 0 auto; width: 12px; height: 12px; }
  .tchip:hover { background: rgba(255, 255, 255, .17); color: #fff; }
  /* The most recent stop. Orange because it is the one she reaches for. */
  .tchip.back { background: rgba(255, 107, 0, .16); border-color: rgba(255, 107, 0, .6); color: #fff; }
  .tchip.back svg { color: var(--accent); }
  .tchip.back:hover { background: rgba(255, 107, 0, .3); }
  .tchip.two { max-width: 200px; }
  .tchip.hist { flex: 0 0 auto; }
  .tchip .caret { width: 10px; height: 10px; opacity: .7; }

  .hwrap { position: relative; }

  .trailmenu {
    position: absolute; right: 0; top: calc(100% + 9px);
    width: 440px; max-width: 84vw;
    background: var(--paper); color: var(--ink);
    border-radius: var(--r-lg); box-shadow: 0 8px 30px rgba(0, 0, 0, .14);
    overflow: hidden; z-index: 70; animation: rise .16s var(--ease);
  }
  .trailmenu .tmhead {
    font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--navy); padding: 14px 18px 10px;
  }
  .trailmenu ul { list-style: none; margin: 0; padding: 0; }
  .trailmenu li { border-top: 1px solid var(--hairline-soft); }
  .trailmenu button {
    display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
    background: none; border: 0; padding: 11px 18px;
    transition: background .11s var(--ease);
  }
  .trailmenu button:hover { background: var(--navy-50); }
  /* The top row is the one the orange chip goes to, tinted so the two read as the same thing. */
  .trailmenu li:first-child button { background: var(--accent-tint); }
  .trailmenu li:first-child button:hover { background: var(--accent-tint-2); }
  .trailmenu .navicon { width: 26px; height: 26px; border-radius: 6px; }
  .trailmenu .rowcopy { min-width: 0; flex: 1; }
  .trailmenu .t {
    display: block; font-weight: 600; font-size: 13.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trailmenu .s {
    display: block; color: var(--ink-3); font-size: 11.5px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trailmenu .jump {
    flex: 0 0 auto; font-size: 10px; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase; color: var(--accent-ink);
    opacity: 0; transition: opacity .11s var(--ease);
  }
  .trailmenu li:first-child .jump,
  .trailmenu button:hover .jump,
  .trailmenu button:focus-visible .jump { opacity: 1; }
  .trailmenu .tmfoot {
    padding: 10px 18px; background: #FBFCFD; border-top: 1px solid var(--hairline);
    color: var(--ink-3); font-size: 11.5px;
  }

  .resume {
    display: flex; align-items: center; gap: 14px; flex: 0 0 auto;
    padding: 10px 22px;
    background: var(--accent-tint); border-bottom: 1px solid var(--accent-line);
  }
  .resume[hidden] { display: none; }
  .resume .mark { flex: 0 0 auto; width: 13px; height: 16px; color: var(--accent-ink); }
  .resume p { margin: 0; flex: 1; min-width: 0; font-size: 13px; color: var(--ink-2); }
  .resume b { color: var(--accent-ink); }
  .resume .doc { color: var(--ink); font-weight: 600; }
  .resume .btn.ghost { border-color: var(--accent-line); color: var(--accent-ink); }
  .resume .btn.ghost:hover { background: var(--accent-tint-2); border-color: #EEBA8C; }

  .searchcue {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 255, 255, .1);
    border: 1px solid rgba(255, 255, 255, .16);
    color: rgba(255, 255, 255, .82);
    border-radius: 999px; padding: 6px 8px 6px 16px;
    font-size: 12.5px; transition: background .15s var(--ease);
  }
  .searchcue:hover { background: rgba(255, 255, 255, .17); color: #fff; }
  .searchcue kbd {
    font-family: inherit; font-size: 10.5px; font-weight: 600;
    background: rgba(255, 255, 255, .16); border-radius: 5px; padding: 2px 7px;
  }

  .topbar .ghost-light {
    background: transparent; border: 1px solid rgba(255, 255, 255, .28);
    color: #fff; border-radius: 999px; padding: 6px 15px;
    font-size: 12.5px; font-weight: 600; transition: background .15s var(--ease);
  }
  .topbar .ghost-light:hover { background: rgba(255, 255, 255, .14); }

  .body { display: flex; flex: 1; min-height: 0; }

  /* ============================== rail ============================== */

  .nav {
    flex: 0 0 234px; background: var(--paper);
    border-right: 1px solid var(--hairline);
    padding: 18px 12px; overflow-y: auto;
  }
  .nav .group {
    font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-3); padding: 0 12px; margin: 20px 0 7px;
  }
  .nav .group:first-child { margin-top: 0; }
  .nav button {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    width: 100%; text-align: left; background: none; border: 0;
    padding: 8px 12px; border-radius: 8px; color: var(--ink-2);
    font-weight: 500; font-size: 13.5px; margin-bottom: 1px;
    transition: background .13s var(--ease), color .13s var(--ease);
  }
  .nav button:hover { background: var(--navy-50); color: var(--navy); }
  .nav button[aria-current="true"] {
    background: var(--navy); color: #fff; font-weight: 600;
  }
  .nav .count {
    font-size: 10.5px; font-weight: 700; background: var(--grey-bg); color: var(--ink-3);
    border-radius: 999px; padding: 1px 7px; min-width: 20px; text-align: center;
  }
  .nav button[aria-current="true"] .count { background: rgba(255, 255, 255, .22); color: #fff; }
  .nav .count.hot { background: var(--red-bg); color: var(--red); }
  .nav button[aria-current="true"] .count.hot { background: rgba(255, 255, 255, .26); color: #fff; }
  .nav .lbl { flex: 1; }
  /* The icons are a navy glyph on a pale tinted square. That tint carries them on the
     selected navy row too, so they are left alone - reversing them out turns the tint white
     as well and the whole icon becomes a solid block. */
  .navicon { width: 22px; height: 22px; flex: 0 0 auto; border-radius: 5px; }

  /* ============================== main ============================== */

  .main { flex: 1; min-width: 0; overflow-y: auto; }
  /* Wide enough to use a real monitor. The reader keeps its own narrow measure regardless -
     long-form text wants 68 characters no matter how much room there is. */
  .wrap { max-width: 1560px; padding: 30px 40px 90px; }
  .main.split { display: flex; gap: 0; padding: 0; overflow: hidden; }

  .page-head { margin-bottom: 26px; }
  .page-head.titled { display: flex; align-items: flex-start; gap: 16px; }
  .pageicon { width: 42px; height: 42px; flex: 0 0 auto; border-radius: 8px; margin-top: 2px; }
  .readstamp { height: 24px; width: auto; display: block; }
  h2.page {
    margin: 0 0 6px; font-size: 25px; font-weight: 700; letter-spacing: -.015em;
    color: var(--navy);
  }
  p.lede { margin: 0; color: var(--ink-2); max-width: 70ch; font-size: 14px; }

  h3.group {
    margin: 34px 0 12px; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3);
    display: flex; align-items: center; gap: 12px;
  }
  h3.group::after {
    content: ''; flex: 1; height: 1px; background: var(--hairline);
  }
  h3.group:first-of-type { margin-top: 0; }

  /* ============================== hero ============================== */

  /* The masthead, the phase strip and the day-one card are one stacked column and all run to
     the same width. Three different caps read as an accident rather than a hierarchy. */
  .welcomehero, .welcomecard, .rampstrip {
    display: block; width: 100%; height: auto; border-radius: var(--r-lg);
  }
  .welcomehero { margin-bottom: 14px; box-shadow: var(--shadow); }
  .rampstrip { margin-bottom: 14px; }
  .welcomecard {
    margin: 0 0 26px;
    border: 1px solid var(--hairline); box-shadow: var(--shadow-sm);
  }

  /* Concept diagrams sit above the document that teaches them. They are self-contained
     slides, so they get the full reader width rather than the text measure. */
  .diagram {
    display: block; width: 100%; height: auto; max-width: 1100px;
    border-radius: var(--r); margin: 14px 0 26px; box-shadow: var(--shadow);
  }

  .hero {
    background-size: cover; background-position: center;
    border-radius: var(--r-lg); margin-bottom: 16px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .hero-in {
    display: flex; align-items: center; gap: 26px;
    padding: 30px 38px; min-height: 172px;
  }
  .hero .medallion { width: 104px; height: 104px; flex: 0 0 auto; }
  .hero-copy { min-width: 0; }
  .hero .eyebrow {
    font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255, 255, 255, .72); margin-bottom: 9px;
  }
  .hero h2 {
    margin: 0 0 6px; color: #fff; font-size: 30px; font-weight: 700; letter-spacing: -.02em;
  }
  .hero p { margin: 0; color: rgba(255, 255, 255, .88); font-size: 14px; }
  .hero-stats { display: flex; gap: 22px; margin-top: 14px; flex-wrap: wrap; }
  .hero-stats span { color: rgba(255, 255, 255, .78); font-size: 12.5px; }
  .hero-stats b { color: #fff; font-size: 15px; font-weight: 700; margin-right: 4px; }

  /* Tier section headers on the ladder. */
  .tierhead {
    display: flex; align-items: center; gap: 14px;
    margin: 32px 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--hairline);
  }
  .tierhead:first-of-type { margin-top: 0; }
  .tierhead img { width: 44px; height: 44px; flex: 0 0 auto; border-radius: var(--r-sm); }
  .tierhead b { display: block; font-size: 15px; font-weight: 700; color: var(--navy); }
  .tierhead span { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }

  /* Meeting cards and phase medals. */
  .meetings {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px;
  }
  .meetings img {
    width: 100%; height: auto; display: block;
    border: 1px solid var(--hairline); border-radius: var(--r); box-shadow: var(--shadow-sm);
  }

  .medals { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  .medals img { width: 132px; height: auto; }

  /* The folder banner, in the reader where it is wide enough to read. */
  .folderbanner {
    display: block; width: 100%; height: auto; max-width: 1100px;
    border: 1px solid var(--hairline); border-radius: var(--r);
    margin: 14px 0 20px;
  }

  /* Status stamps and project badges, in the detail panel only. */
  .stamprow {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;
  }
  .stamprow .stamp { height: 26px; width: auto; display: block; }
  .accountbadge {
    display: block; width: 250px; max-width: 100%; height: auto; margin-bottom: 15px;
    border: 1px solid var(--hairline); border-radius: var(--r-sm);
  }

  /* ============================== cards ============================== */

  .card {
    background: var(--paper); border: 1px solid var(--hairline);
    border-radius: var(--r); padding: 18px 20px; margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
  }
  .card.plain { box-shadow: none; }
  .card.tight { padding: 13px 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }

  .stat {
    background: var(--paper); border: 1px solid var(--hairline);
    border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow-sm);
  }
  .stat .n {
    font-size: 27px; font-weight: 700; color: var(--navy);
    line-height: 1.15; letter-spacing: -.02em;
  }
  .stat .n small { font-size: 15px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
  .stat .k {
    font-size: 10.5px; color: var(--ink-3); text-transform: uppercase;
    letter-spacing: .085em; font-weight: 700; margin-top: 5px;
  }

  .meter { height: 4px; background: var(--hairline-soft); border-radius: 999px; margin-top: 11px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--navy); border-radius: 999px; transition: width .4s var(--ease); }

  /* ============================== chips ============================== */

  .chip {
    display: inline-block; border-radius: 999px; padding: 2px 10px;
    font-size: 11px; font-weight: 600; white-space: nowrap; letter-spacing: .01em;
    background: var(--grey-bg); color: var(--grey);
  }
  .chip.green { background: var(--green-bg); color: var(--green); }
  .chip.amber { background: var(--amber-bg); color: var(--amber); }
  .chip.red   { background: var(--red-bg);   color: var(--red); }
  .chip.blue  { background: var(--navy-100); color: var(--navy); }
  .chip.mono  { font-variant-numeric: tabular-nums; letter-spacing: .02em; }

  /* ============================== controls ============================== */

  label.field { display: block; margin-bottom: 13px; }
  label.field > span {
    display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-3);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: .085em;
  }

  input[type="text"], input[type="date"], input[type="number"], input[type="url"],
  input[type="search"], select, textarea {
    width: 100%; padding: 8px 11px;
    border: 1px solid var(--hairline); border-radius: 8px;
    background: var(--paper); color: var(--ink);
    transition: border-color .13s var(--ease), box-shadow .13s var(--ease);
  }
  input:hover, select:hover, textarea:hover { border-color: #CFD5DE; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--navy-600);
    box-shadow: 0 0 0 3px var(--navy-50);
  }
  textarea { resize: vertical; min-height: 74px; line-height: 1.6; }
  ::placeholder { color: #A2A9B2; }

  .btn {
    background: var(--navy); color: #fff; border: 0; border-radius: 8px;
    padding: 9px 17px; font-weight: 600; font-size: 13.5px;
    transition: background .13s var(--ease), transform .08s var(--ease);
  }
  .btn:hover { background: var(--navy-600); }
  .btn:active { transform: translateY(1px); }
