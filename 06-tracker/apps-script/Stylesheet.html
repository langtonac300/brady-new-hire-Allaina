<style>
  /*
   * Brady house style: Brady Blue #002D72, Montserrat, no emoji in the interface itself.
   * Status is always carried by a word as well as a colour - colour alone fails anyone who
   * cannot distinguish the two, and it fails everyone in a screenshot printed in mono.
   */

  :root {
    --blue: #002D72;
    --blue-mid: #1F4C97;
    --blue-pale: #DCE6F5;
    --blue-wash: #F3F6FC;
    --ink: #1A1C1F;
    --muted: #5A6068;
    --line: #DCE0E6;
    --bg: #FFFFFF;
    --shell: #F5F7FA;
    --green: #0B6E4F;
    --green-bg: #E4F2EC;
    --amber: #7A5C00;
    --amber-bg: #FBF3D5;
    --red: #8C1D18;
    --red-bg: #FBE9E7;
    --grey: #5A6068;
    --grey-bg: #EEF0F3;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 12px rgba(16, 24, 40, .06);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--shell);
    color: var(--ink);
    font-family: Montserrat, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.55;
  }

  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

  :focus-visible { outline: 3px solid var(--blue-mid); outline-offset: 2px; border-radius: 4px; }

  /* ---------- shell ---------- */

  .app { display: flex; flex-direction: column; height: 100vh; }

  .topbar {
    display: flex; align-items: center; gap: 20px;
    padding: 12px 20px;
    background: var(--blue); color: #fff;
    flex: 0 0 auto;
  }
  .topbar h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .01em; }
  .topbar .spacer { flex: 1; }
  .daychip {
    display: flex; align-items: baseline; gap: 8px;
    background: rgba(255,255,255,.14); border-radius: 999px; padding: 5px 14px;
  }
  .daychip b { font-size: 17px; }
  .daychip span { font-size: 12px; opacity: .92; }
  .topbar .who { font-size: 13px; opacity: .92; }

  .body { display: flex; flex: 1; min-height: 0; }

  .nav {
    flex: 0 0 208px; background: var(--bg); border-right: 1px solid var(--line);
    padding: 12px 10px; overflow-y: auto;
  }
  .nav button {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    padding: 9px 12px; border-radius: 8px; color: var(--ink); font-weight: 500;
  }
  .nav button:hover { background: var(--blue-wash); }
  .nav button[aria-current="true"] { background: var(--blue); color: #fff; font-weight: 600; }
  .nav .count {
    font-size: 11px; font-weight: 600; background: var(--grey-bg); color: var(--muted);
    border-radius: 999px; padding: 1px 8px; min-width: 22px; text-align: center;
  }
  .nav button[aria-current="true"] .count { background: rgba(255,255,255,.22); color: #fff; }

  .main { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 26px 60px; }
  .main.split { display: flex; gap: 20px; padding-right: 20px; }

  /* ---------- type ---------- */

  h2.page { margin: 0 0 4px; font-size: 22px; color: var(--blue); font-weight: 700; }
  p.lede { margin: 0 0 20px; color: var(--muted); max-width: 68ch; }
  h3.group {
    margin: 26px 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); font-weight: 700;
  }

  /* ---------- cards ---------- */

  .card {
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .card.flat { box-shadow: none; }
  .card h4 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  .card .meta { color: var(--muted); font-size: 12.5px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }

  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat .n { font-size: 26px; font-weight: 700; color: var(--blue); line-height: 1.2; }
  .stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }

  /* ---------- chips ---------- */

  .chip {
    display: inline-block; border-radius: 999px; padding: 2px 10px;
    font-size: 11.5px; font-weight: 600; white-space: nowrap;
    background: var(--grey-bg); color: var(--grey);
  }
  .chip.green  { background: var(--green-bg); color: var(--green); }
  .chip.amber  { background: var(--amber-bg); color: var(--amber); }
  .chip.red    { background: var(--red-bg);   color: var(--red); }
  .chip.blue   { background: var(--blue-pale); color: var(--blue); }
  .chip.live   { background: var(--amber-bg); color: var(--amber); }

  /* ---------- controls ---------- */

  label.field { display: block; margin-bottom: 12px; }
  label.field > span {
    display: block; font-size: 12px; font-weight: 600; color: var(--muted);
    margin-bottom: 4px; text-transform: uppercase; letter-spacing: .05em;
  }

  input[type="text"], input[type="date"], input[type="number"], input[type="url"], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
  select { cursor: pointer; }

  .btn {
    background: var(--blue); color: #fff; border: 0; border-radius: 8px;
    padding: 9px 16px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: var(--blue-mid); }
  .btn.ghost { background: transparent; color: var(--blue); border: 1px solid var(--line); }
  .btn.ghost:hover { background: var(--blue-wash); }
  .btn.danger { background: transparent; color: var(--red); border: 1px solid var(--line); }
  .btn.danger:hover { background: var(--red-bg); }
  .btn.small { padding: 5px 11px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: default; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.tight { gap: 6px; }
  .push { margin-left: auto; }

  /* ---------- library ---------- */

  .libnav { flex: 0 0 330px; display: flex; flex-direction: column; min-height: 0; }
  .libnav .search { margin-bottom: 10px; }
  .liblist { overflow-y: auto; flex: 1; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
  .liblist .folder {
    position: sticky; top: 0; background: var(--blue-wash); color: var(--blue);
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
    padding: 7px 14px; border-bottom: 1px solid var(--line); z-index: 1;
  }
  .liblist button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--line); padding: 10px 14px; cursor: pointer;
  }
  .liblist button:hover { background: var(--blue-wash); }
  .liblist button[aria-current="true"] { background: var(--blue-pale); }
  .liblist .t { font-weight: 600; display: block; margin-bottom: 3px; }
  .liblist .s { color: var(--muted); font-size: 12px; display: block; }

  .reader {
    flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 0; display: flex; flex-direction: column;
    box-shadow: var(--shadow);
  }
  .reader .head {
    padding: 16px 26px; border-bottom: 1px solid var(--line);
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .reader .head h3 { margin: 0; font-size: 18px; color: var(--blue); }
  .reader .scroll { overflow-y: auto; padding: 8px 26px 40px; }

  /* ---------- rendered markdown ---------- */

  .md { max-width: 76ch; }
  .md h1 { font-size: 21px; color: var(--blue); margin: 22px 0 8px; }
  .md h2 { font-size: 17px; color: var(--blue); margin: 26px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
  .md h3 { font-size: 15px; margin: 20px 0 6px; }
  .md h4, .md h5, .md h6 { font-size: 14px; margin: 16px 0 4px; }
  .md p { margin: 0 0 12px; }
  .md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
  .md li { margin-bottom: 5px; }
  .md li > ul, .md li > ol { margin-top: 5px; }
  .md a { color: var(--blue-mid); }
  .md a.doclink { font-weight: 600; text-decoration-style: dotted; }
  .md a.dead { color: var(--muted); text-decoration: none; cursor: default; }
  .md code {
    background: var(--grey-bg); padding: 1px 5px; border-radius: 4px;
    font-family: "Roboto Mono", Consolas, monospace; font-size: 12.5px;
  }
  .md pre {
    background: #1A1C1F; color: #F1F3F4; padding: 14px 16px; border-radius: 8px;
    overflow-x: auto; margin: 0 0 14px;
  }
  .md pre code { background: none; color: inherit; padding: 0; font-size: 12.5px; }
  .md blockquote {
    margin: 0 0 14px; padding: 10px 16px; border-left: 4px solid var(--blue);
    background: var(--blue-wash); border-radius: 0 8px 8px 0;
  }
  .md blockquote > :last-child { margin-bottom: 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
  .md table { border-collapse: collapse; width: 100%; margin: 0 0 16px; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--blue-wash); color: var(--blue); font-weight: 700; }
  .md tbody tr:nth-child(even) { background: #FAFBFD; }
  .md .tablewrap { overflow-x: auto; margin-bottom: 16px; }
  .md .tablewrap table { margin-bottom: 0; }
  .md .task { list-style: none; margin-left: -22px; }
  .md .task input { margin-right: 8px; }

  /* ---------- ladder ---------- */

  .proj { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); margin-bottom: 10px; }
  .proj > .top { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; }
  .proj .idbadge {
    flex: 0 0 auto; font-weight: 700; color: var(--blue); background: var(--blue-pale);
    border-radius: 6px; padding: 3px 9px; font-size: 12.5px; min-width: 52px; text-align: center;
  }
  .proj .title { flex: 1; min-width: 0; }
  .proj .title b { font-size: 14.5px; }
  .proj .title .meta { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .proj .detail { border-top: 1px solid var(--line); padding: 14px 16px; background: var(--blue-wash); }
  .proj .detail .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .proj .brief { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .proj.alias { opacity: .82; }

  /* ---------- log lists ---------- */

  .entry { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); padding: 14px 16px; margin-bottom: 10px; }
  .entry .head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .entry .q { font-weight: 600; font-size: 14.5px; }
  .entry dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
  .entry dt { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
  .entry dd { margin: 0; }

  /* ---------- self-assessment ---------- */

  table.skills { width: 100%; border-collapse: collapse; background: var(--bg); margin-bottom: 20px; }
  table.skills th, table.skills td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: middle; }
  table.skills th { background: var(--blue-wash); color: var(--blue); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  table.skills td.skill { width: 40%; }
  table.skills select { min-width: 130px; }

  /* ---------- misc ---------- */

  .empty { color: var(--muted); padding: 26px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); background: var(--bg); }
  .callout { border-left: 4px solid var(--amber); background: var(--amber-bg); color: var(--amber); padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 16px; }
  .callout b { color: inherit; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px;
    box-shadow: var(--shadow); transition: transform .18s ease; z-index: 50; font-size: 13px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--red); }

  .loading { padding: 60px; text-align: center; color: var(--muted); }

  @media (max-width: 1000px) {
    .main.split { flex-direction: column; }
    .libnav { flex: 0 0 auto; max-height: 300px; }
  }
</style>
