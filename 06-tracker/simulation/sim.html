.top-bar .metric-label { font-size: 0.7rem; color: var(--text-3); text-transform: uppercase; }

.sidebar { width: 200px; background: var(--white); border-right: 1px solid var(--border); padding: 1rem 0; flex-shrink: 0; }

.sidebar a.active { color: var(--blue); font-weight: 600; border-left-color: var(--blue); background: var(--blue-light); }

/* TABLES */
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 2px solid var(--border); color: var(--text-2); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; white-space: nowrap; }
td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border-light); }

.btn-primary { background: var(--blue); color: #fff; }

// Pre-compute a map of query text to query object
const QUERY_MAP = new Map(QUERIES.map(q => [q.q.toLowerCase(), q]));

// ============================================================
// KEYWORD MATCHING
// ============================================================
function matchesExact(keyword, query) {
  return query.toLowerCase() === keyword.toLowerCase();
}

function matchesPhrase(keyword, query) {
  return query.toLowerCase().includes(keyword.toLowerCase());
}

function matchesBroad(keyword, queryObj) {
  const kwWords = keyword.toLowerCase().split(/\s+/);
  const qLower = queryObj.q.toLowerCase();
  const qTags = queryObj.tags.map(t => t.toLowerCase());
  let matchCount = 0;
  for (const w of kwWords) {
    if (qLower.includes(w) || qTags.some(t => t.includes(w))) matchCount++;
  }
  return matchCount >= Math.max(1, Math.ceil(kwWords.length * 0.5));
}

function keywordMatchesQuery(kw, queryObj) {
  if (!kw.enabled) return false;
  switch (kw.matchType) {
    case 'exact': return matchesExact(kw.text, queryObj.q);
    case 'phrase': return matchesPhrase(kw.text, queryObj.q);
    case 'broad': return matchesBroad(kw.text, queryObj);
    default: return false;
  }
}

function isNegated(query, negatives) {
  const qLower = query.toLowerCase();
  return negatives.some(n => qLower.includes(n.toLowerCase()));
}

// STATE
// ============================================================

// ============================================================

  const weekIdx = state.week;
  const wave = CONFIG.trafficWaves[weekIdx] || 1.0;

  let weekSpend = 0;
  let weekImpressions = 0;
  let weekClicks = 0;
  let weekSearchTerms = [];

  const allKeywords = state.adGroups.flatMap((ag, agi) =>
    ag.keywords.filter(k => k.enabled).map(k => ({ ...k, adGroupIdx: agi, adGroupName: ag.name }))
  );

  if (allKeywords.length === 0) {
    state.weeklyHistory.push({
      week: weekIdx + 1, impressions: 0, clicks: 0, spend: 0,
      conversions: 0, conversionValue: 0, searchTerms: [], cpa: 0, roas: 0,
    });
    state.week++;
    resolveConversions(weekIdx + 1);
    return;
  }

  for (const queryObj of QUERIES) {
    if (isNegated(queryObj.q, state.negativeKeywords)) continue;

    const matchingKws = allKeywords.filter(kw => keywordMatchesQuery(kw, queryObj));
    if (matchingKws.length === 0) continue;

    const bestKw = matchingKws[0];
    const rawImpressions = Math.round(queryObj.baseImp * wave * (0.7 + Math.random() * 0.6));
    const ctr = queryObj.baseCtr * (0.8 + Math.random() * 0.4) * adQualityMultiplier(bestKw.adGroupIdx);
    const clicks = Math.round(rawImpressions * ctr);
    const cpc = (bestKw.bid || CONFIG.defaultBid) * (0.6 + Math.random() * 0.5);
    const cost = clicks * cpc;

    if (weekSpend + cost > weekBudget * 1.1) {
      const remainBudget = weekBudget * 1.1 - weekSpend;
      const affordableClicks = Math.floor(remainBudget / cpc);
      if (affordableClicks <= 0) continue;
      const adjCost = affordableClicks * cpc;
      const adjImp = Math.round(rawImpressions * (affordableClicks / Math.max(clicks, 1)));
      weekImpressions += adjImp;
      weekClicks += affordableClicks;
      weekSpend += adjCost;
      scheduleConversions(queryObj, affordableClicks, weekIdx);
      weekSearchTerms.push({ query: queryObj.q, intent: queryObj.intent, impressions: adjImp, clicks: affordableClicks, cost: adjCost, keyword: bestKw.text, matchType: bestKw.matchType, adGroup: bestKw.adGroupName });
      break;
    }

    weekImpressions += rawImpressions;
    weekClicks += clicks;
    weekSpend += cost;
    scheduleConversions(queryObj, clicks, weekIdx);
    weekSearchTerms.push({ query: queryObj.q, intent: queryObj.intent, impressions: rawImpressions, clicks, cost, keyword: bestKw.text, matchType: bestKw.matchType, adGroup: bestKw.adGroupName });

    bestKw._impressions = (bestKw._impressions || 0) + rawImpressions;
    bestKw._clicks = (bestKw._clicks || 0) + clicks;
    bestKw._cost = (bestKw._cost || 0) + cost;
  }

  weekSearchTerms.sort((a, b) => b.clicks - a.clicks);

  const arrivedConversions = resolveConversions(weekIdx + 1);

  state.weeklyHistory.push({
    week: weekIdx + 1,
    impressions: weekImpressions,
    clicks: weekClicks,
    spend: weekSpend,
    conversions: arrivedConversions.count,
    conversionValue: arrivedConversions.value,
    searchTerms: weekSearchTerms,
    cpa: arrivedConversions.count > 0 ? weekSpend / arrivedConversions.count : 0,
    roas: weekSpend > 0 ? arrivedConversions.value / weekSpend : 0,
    wave,
  });

  state.totalSpend += weekSpend;
  state.totalClicks += weekClicks;
  state.totalImpressions += weekImpressions;
  state.totalConversions += arrivedConversions.count;
  state.totalConversionValue += arrivedConversions.value;
  state.week++;
}

function scheduleConversions(queryObj, clicks, fromWeek) {
  if (queryObj.baseCvr <= 0) return;
  for (let i = 0; i < clicks; i++) {
    if (Math.random() > queryObj.baseCvr) continue;
    const delay = pickConversionDelay();
    const arriveWeek = fromWeek + 1 + delay;
    state.pendingConversions.push({
      fromWeek: fromWeek + 1,
      arriveWeek,
      value: queryObj.value * (0.5 + Math.random()),
      query: queryObj.q,
    });
  }
}

function pickConversionDelay() {
  const r = Math.random();
  let cumul = 0;
  for (const d of CONFIG.conversionDelayDist) {
    cumul += d.pct;
    if (r <= cumul) {
      return d.minDelay + Math.floor(Math.random() * (d.maxDelay - d.minDelay + 1));
    }
  }
  return 0;
}

function resolveConversions(currentWeek) {
  let count = 0, value = 0;
  for (const c of state.pendingConversions) {
    if (c.arriveWeek === currentWeek && !c.resolved) {
      c.resolved = true;
      count++;
      value += c.value;
    }
  }
  return { count, value };
}

function adQualityMultiplier(adGroupIdx) {
  const ag = state.adGroups[adGroupIdx];
  if (!ag || ag.ads.length === 0) return 0.6;
  const ad = ag.ads.find(a => a.enabled);
  if (!ad) return 0.5;
  const headlines = ad.headlines.filter(h => h.trim()).length;
  const descs = ad.descriptions.filter(d => d.trim()).length;
  if (headlines >= 8 && descs >= 3) return 1.1;
  if (headlines >= 5 && descs >= 2) return 0.95;
  if (headlines >= 3 && descs >= 1) return 0.8;
  return 0.6;
}

function getTotalStats() {
  let maturedConversions = 0, maturedValue = 0;
  for (const c of state.pendingConversions) {
    if (c.resolved) { maturedConversions++; maturedValue += c.value; }
  }
  const pendingCount = state.pendingConversions.filter(c => !c.resolved).length;
  return {
    spend: state.totalSpend,
    clicks: state.totalClicks,
    impressions: state.totalImpressions,
    conversions: maturedConversions,
    conversionValue: maturedValue,
    pendingConversions: pendingCount,
    cpa: maturedConversions > 0 ? state.totalSpend / maturedConversions : 0,
    roas: state.totalSpend > 0 ? maturedValue / state.totalSpend : 0,
    ctr: state.totalImpressions > 0 ? state.totalClicks / state.totalImpressions : 0,
    avgCpc: state.totalClicks > 0 ? state.totalSpend / state.totalClicks : 0,
  };
}

// ============================================================
// SCORING
// ============================================================
function calculateScore() {
  const stats = getTotalStats();
  let score = 0;
  const details = [];

  // CPA score (0-25)
  if (stats.conversions > 0) {
    const cpaRatio = stats.cpa / CONFIG.targetCpa;
    if (cpaRatio <= 0.8) { score += 25; details.push({ cat: 'CPA vs Target', pts: 25, max: 25, note: `$${fmt(stats.cpa)} — well under $${CONFIG.targetCpa} target` }); }
    else if (cpaRatio <= 1.0) { score += 20; details.push({ cat: 'CPA vs Target', pts: 20, max: 25, note: `$${fmt(stats.cpa)} — within target` }); }
    else if (cpaRatio <= 1.3) { score += 12; details.push({ cat: 'CPA vs Target', pts: 12, max: 25, note: `$${fmt(stats.cpa)} — above target` }); }
    else { score += 5; details.push({ cat: 'CPA vs Target', pts: 5, max: 25, note: `$${fmt(stats.cpa)} — significantly over target` }); }
  } else { details.push({ cat: 'CPA vs Target', pts: 0, max: 25, note: 'No conversions recorded yet' }); }

  // Waste elimination (0-25)
  const wasteQueries = QUERIES.filter(q => ['jobs','residential','irrelevant'].includes(q.intent));
  const negatedWaste = wasteQueries.filter(q => isNegated(q.q, state.negativeKeywords)).length;
  const wastePct = wasteQueries.length > 0 ? negatedWaste / wasteQueries.length : 0;
  const wastePts = Math.round(wastePct * 25);
  score += wastePts;
  details.push({ cat: 'Waste Blocked', pts: wastePts, max: 25, note: `${negatedWaste}/${wasteQueries.length} waste queries blocked (${Math.round(wastePct*100)}%)` });

  // Keyword coverage (0-20)
  const highIntentQueries = QUERIES.filter(q => q.intent === 'high');
  const allKws = state.adGroups.flatMap(ag => ag.keywords.filter(k => k.enabled));
  const coveredHigh = highIntentQueries.filter(q => allKws.some(kw => keywordMatchesQuery(kw, q))).length;
  const coverPct = highIntentQueries.length > 0 ? coveredHigh / highIntentQueries.length : 0;
  const coverPts = Math.round(coverPct * 20);
  score += coverPts;
  details.push({ cat: 'High-Intent Coverage', pts: coverPts, max: 20, note: `${coveredHigh}/${highIntentQueries.length} high-intent queries reachable` });

  // Ad copy quality (0-15)
  let adScore = 0;
  const adsWithContent = state.adGroups.filter(ag => ag.ads.some(a => a.enabled && a.headlines.filter(h=>h.trim()).length >= 3));
  if (adsWithContent.length >= 3) { adScore = 15; }
  else if (adsWithContent.length >= 2) { adScore = 10; }
  else if (adsWithContent.length >= 1) { adScore = 5; }
  score += adScore;
  details.push({ cat: 'Ad Copy', pts: adScore, max: 15, note: `${adsWithContent.length}/3 ad groups have quality ads` });

  // Efficiency — pipeline ROAS (0-15). B2B search is traffic-constrained, so we reward
  // capturing high-value queries efficiently, not spending the whole budget.
  let effPts = 0;
  const roas = stats.roas;
  if (roas >= 20) { effPts = 15; }
  else if (roas >= 12) { effPts = 11; }
  else if (roas >= 6) { effPts = 7; }
  else if (roas > 0) { effPts = 3; }
  score += effPts;
  details.push({ cat: 'Efficiency (pipeline ROAS)', pts: effPts, max: 15, note: stats.conversions > 0 ? `${fmtD(roas)}x pipeline value returned per $1 spent` : 'No conversions matured yet' });

  const grade = score >= 85 ? 'A' : score >= 70 ? 'B' : score >= 55 ? 'C' : score >= 40 ? 'D' : 'F';
  return { score, grade, details, stats };
}

// ============================================================
// HELPERS
// ============================================================
function fmt(n) { return Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 }); }
function fmtD(n) { return Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function fmtPct(n) { return (n * 100).toFixed(1) + '%'; }
function fmtMoney(n) { return '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 }); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

}

            <tr>
              <td>Week ${w.week}</td>
              <td class="num">${fmt(w.impressions)}</td>
              <td class="num">${fmt(w.clicks)}</td>
              <td class="num">${w.impressions > 0 ? fmtPct(w.clicks/w.impressions) : '—'}</td>
              <td class="num">${fmtMoney(w.spend)}</td>
              <td class="num">${w.conversions}${w.week <= state.week - 3 ? '' : '<span class="delay-badge">maturing</span>'}</td>
              <td class="num">${w.conversions > 0 ? fmtMoney(w.spend/w.conversions) : '—'}</td>
              <td>${'&#x25A0;'.repeat(Math.round(w.wave * 5))} ${w.wave}x</td>
            </tr>`).join('')}
        </tbody>
      </table>
      </div>
    </div>`;
}

function renderSearchTerms(current) {
  if (!current || current.searchTerms.length === 0) {
    return `<div class="panel-title">Search Terms</div><p class="panel-desc">No search term data yet. Run a week first.</p>`;
  }

  const intentLabel = (intent) => {
    const map = { high: '&#x2705; Buyer', research: '&#x1F50D; Research', jobs: '&#x274C; Job seeker', residential: '&#x274C; Residential', irrelevant: '&#x274C; Irrelevant', gray: '&#x26A0; Gray zone', competitor: '&#x1F3AF; Competitor' };
    return map[intent] || intent;
  };

  const rows = current.searchTerms.map(st => {
    const isNeg = isNegated(st.query, state.negativeKeywords);
    return `
      <tr class="${isNeg ? 'neg-added' : ''}">
        <td>${st.query}</td>
        <td>${intentLabel(st.intent)}</td>
        <td class="num">${fmt(st.impressions)}</td>
        <td class="num">${fmt(st.clicks)}</td>
        <td class="num">${fmtMoney(st.cost)}</td>
        <td><span class="tag tag-${st.matchType}">${st.matchType}</span> ${st.keyword}</td>
        <td>${isNeg ? '<span style="color: var(--green); font-weight: 600;">Blocked</span>' : `<button class="btn btn-sm btn-outline" onclick="addNegativeFromST('${escJs(st.query)}')">+ Negative</button>`}</td>
      </tr>`;
  }).join('');

  return `
    <div class="panel-title">Search Terms — Week ${state.week}</div>
    <p class="panel-desc">These are the actual queries people searched that triggered your ads. Add irrelevant ones as negative keywords to stop paying for them.</p>
    <div class="card" style="overflow-x: auto;">
      <table>
        <thead><tr><th>Search Term</th><th>Intent</th><th class="num">Impr</th><th class="num">Clicks</th><th class="num">Cost</th><th>Matched By</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderKeywordsTab() {
  const allKws = state.adGroups.flatMap((ag, agi) =>
    ag.keywords.map((kw, ki) => ({ ...kw, agName: ag.name, agi, ki }))
  );

  const rows = allKws.map(kw => `
    <tr>
      <td><span class="status-dot ${kw.enabled ? 'status-active' : 'status-paused'}"></span>${kw.enabled ? 'Active' : 'Paused'}</td>
      <td>${kw.agName}</td>
      <td><span class="tag tag-${kw.matchType}">${kw.matchType}</span> ${kw.text}</td>
      <td class="num">$${fmtD(kw.bid)}</td>
      <td>
        <button class="btn btn-sm ${kw.enabled ? 'btn-outline' : 'btn-success'}" onclick="toggleKeyword(${kw.agi}, ${kw.ki})">${kw.enabled ? 'Pause' : 'Enable'}</button>
      </td>
    </tr>`).join('');

  return `
    <div class="panel-title">Keywords</div>
    <p class="panel-desc">Manage your keywords. Pause underperformers or adjust bids.</p>
    <div class="card">
      <div class="form-row-inline" style="margin-bottom: 1rem;">
        <div class="form-group"><label>Keyword</label><input type="text" id="kw-text" placeholder="e.g. fire alarm inspection"></div>
        <div class="form-group" style="max-width: 140px;"><label>Match Type</label>
          <select id="kw-match"><option value="phrase">Phrase</option><option value="exact">Exact</option><option value="broad">Broad</option></select>
        </div>
        <div class="form-group" style="max-width: 120px;"><label>Ad Group</label>
          <select id="kw-ag">${state.adGroups.map((ag, i) => `<option value="${i}">${ag.name}</option>`).join('')}</select>
        </div>
        <div class="form-group" style="max-width: 90px;"><label>Bid</label><input type="number" id="kw-bid" value="4.50" step="0.50" min="0.50" max="20"></div>
        <div class="form-group" style="max-width: 80px;"><label>&nbsp;</label><button class="btn btn-primary" onclick="addKeywordRunning()">Add</button></div>
      </div>
    </div>
    <div class="card" style="overflow-x: auto;">
      <table>
        <thead><tr><th>Status</th><th>Ad Group</th><th>Keyword</th><th class="num">Bid</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderAdsTab() {
  const agIdx = state.selectedAdGroup;
  const ag = state.adGroups[agIdx];
  const ad = ag.ads[0] || { headlines: Array(15).fill(''), descriptions: Array(4).fill(''), enabled: true };

  const agTabs = state.adGroups.map((a, i) =>
    `<button class="btn ${i === agIdx ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="state.selectedAdGroup=${i}; render();" style="margin-right: 0.5rem;">${a.name}</button>`
  ).join('');

  const headlineInputs = ad.headlines.slice(0, 15).map((h, i) =>
    `<input type="text" maxlength="30" placeholder="Headline ${i+1}" value="${escHtml(h)}" onchange="updateAdHeadline(${agIdx}, ${i}, this.value)" style="margin-bottom: 0.35rem;">`
  ).join('');
  const descInputs = ad.descriptions.slice(0, 4).map((d, i) =>
    `<input type="text" maxlength="90" placeholder="Description ${i+1}" value="${escHtml(d)}" onchange="updateAdDesc(${agIdx}, ${i}, this.value)" style="margin-bottom: 0.35rem;">`
  ).join('');

  return `
    <div class="panel-title">Ad Copy</div>
    <p class="panel-desc">Edit your RSA ads. More quality headlines and descriptions = better CTR.</p>
    <div style="margin-bottom: 1rem;">${agTabs}</div>
    <div class="card">
      <h3>RSA Ad — ${ag.name}</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
        <div><label style="font-weight: 600; font-size: 0.85rem; color: var(--text-2); display: block; margin-bottom: 0.5rem;">Headlines (30 chars)</label>${headlineInputs}</div>
        <div><label style="font-weight: 600; font-size: 0.85rem; color: var(--text-2); display: block; margin-bottom: 0.5rem;">Descriptions (90 chars)</label>${descInputs}</div>
      </div>
    </div>`;
}

function renderNegativesTab() {
  const rows = state.negativeKeywords.map((nk, i) => `
    <tr>
      <td>${nk}</td>
      <td><button class="btn btn-sm btn-danger" onclick="removeNegative(${i})">Remove</button></td>
    </tr>`).join('');

  return `
    <div class="panel-title">Negative Keywords</div>
    <p class="panel-desc">Negative keywords prevent your ads from showing for irrelevant searches. Add terms here that you don't want triggering your ads.</p>
    <div class="card">
      <div class="form-row-inline" style="margin-bottom: 1rem;">
        <div class="form-group"><label>Negative Keyword</label><input type="text" id="neg-text" placeholder="e.g. jobs, residential, DIY"></div>
        <div class="form-group" style="max-width: 80px;"><label>&nbsp;</label><button class="btn btn-primary" onclick="addNegative()">Add</button></div>
      </div>
    </div>
    <div class="card">
      ${state.negativeKeywords.length > 0 ? `
        <table>
          <thead><tr><th>Negative Keyword</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : '<p style="color: var(--text-3); font-style: italic;">No negative keywords yet. Review your Search Terms tab to find irrelevant queries.</p>'}
    </div>`;
}

// ---- SCORECARD ----
function renderScorecard() {
  const result = calculateScore();
  const gradeColor = { A: 'var(--green)', B: 'var(--blue)', C: 'var(--orange)', D: 'var(--red)', F: 'var(--red)' };

  const detailRows = result.details.map(d => `
    <div class="score-item">
      <div class="si-label">${d.cat}</div>
      <div class="si-val">${d.pts} / ${d.max}</div>
      <div class="si-target">${d.note}</div>
    </div>`).join('');

  const pendingNote = result.stats.pendingConversions > 0
    ? `<div class="card" style="background: var(--orange-light); border-color: var(--orange); max-width: 600px; margin: 1rem auto; text-align: left;">
        <strong>${result.stats.pendingConversions} conversions are still maturing.</strong> In a real account, your final numbers would be better than what you see here — B2B leads keep converting for months after the click. This is exactly the maturation lag described in <code>how-brady-measures.md</code>.
      </div>` : '';

  return `
    <div class="score-section">
      <h1>Campaign Complete</h1>
      <p style="color: var(--text-2); font-size: 1.1rem;">12 weeks of Apex Fire Solutions paid search</p>
      <div class="score-grade" style="color: ${gradeColor[result.grade]};">${result.grade}</div>
      <p style="font-size: 1.5rem; font-weight: 600;">${result.score} / 100</p>
      ${pendingNote}
      <div class="score-grid">${detailRows}</div>

      <div class="card" style="max-width: 800px; margin: 2rem auto; text-align: left;">
        <h3>Final Numbers</h3>
        <div class="metric-row">
          <div class="metric-card"><div class="mc-val">${fmtMoney(result.stats.spend)}</div><div class="mc-label">Total Spend</div></div>
          <div class="metric-card"><div class="mc-val">${fmt(result.stats.impressions)}</div><div class="mc-label">Impressions</div></div>
          <div class="metric-card"><div class="mc-val">${fmt(result.stats.clicks)}</div><div class="mc-label">Clicks</div></div>
          <div class="metric-card"><div class="mc-val">${fmt(result.stats.conversions)}</div><div class="mc-label">Conversions</div></div>
          <div class="metric-card"><div class="mc-val">${result.stats.conversions > 0 ? fmtMoney(result.stats.cpa) : '—'}</div><div class="mc-label">CPA</div></div>
          <div class="metric-card"><div class="mc-val">${result.stats.roas > 0 ? fmtD(result.stats.roas) + 'x' : '—'}</div><div class="mc-label">Pipeline ROAS</div></div>
        </div>
      </div>

      <div class="card" style="max-width: 800px; margin: 1rem auto; text-align: left;">
        <h3>What to Reflect On</h3>
        <ul style="padding-left: 1.25rem; color: var(--text-2);">
          <li style="margin-bottom: 0.5rem;"><strong>Match types:</strong> Did your broad match keywords bring in waste? Would tighter match types have been worth the lower volume?</li>
          <li style="margin-bottom: 0.5rem;"><strong>Negative keywords:</strong> How quickly did you catch the job seekers and residential queries? What would you add on day one next time?</li>
          <li style="margin-bottom: 0.5rem;"><strong>The conversion delay:</strong> Did you panic in weeks 1–3 when CPA looked terrible? How would you explain the maturation lag to a stakeholder?</li>
          <li style="margin-bottom: 0.5rem;"><strong>The traffic spike (week 7):</strong> Did you adjust anything, or let the campaign ride? What was the right call?</li>
          <li style="margin-bottom: 0.5rem;"><strong>Budget pacing:</strong> Did you run out of budget in any week? What caused it?</li>
          <li style="margin-bottom: 0.5rem;"><strong>Gray zone queries</strong> (training, regulations, templates): Did you block them or keep them? What's the argument either way?</li>
        </ul>
      </div>

      <div style="margin-top: 2rem;">
        <button class="btn-advance" onclick="resetSim()">Start Over</button>
      </div>
    </div>`;
}

// ============================================================
// EVENT HANDLERS
// ============================================================
function startSetup() { state.phase = 'setup'; render(); }

function selectAdGroup(i) { state.selectedAdGroup = i; render(); }

function addKeyword() {
  const text = document.getElementById('kw-text').value.trim();
  const matchType = document.getElementById('kw-match').value;
  const bid = parseFloat(document.getElementById('kw-bid').value) || CONFIG.defaultBid;
  if (!text) return;
  state.adGroups[state.selectedAdGroup].keywords.push({ text, matchType, bid, enabled: true });
  toast(`Added "${text}" as ${matchType} match`);
  render();
}

function addKeywordRunning() {
  const text = document.getElementById('kw-text').value.trim();
  const matchType = document.getElementById('kw-match').value;
  const agIdx = parseInt(document.getElementById('kw-ag').value);
  const bid = parseFloat(document.getElementById('kw-bid').value) || CONFIG.defaultBid;
  if (!text) return;
  state.adGroups[agIdx].keywords.push({ text, matchType, bid, enabled: true });
  toast(`Added "${text}" to ${state.adGroups[agIdx].name}`);
  render();
}

function removeKeyword(agi, ki) {
  state.adGroups[agi].keywords.splice(ki, 1);
  render();
}

function toggleKeyword(agi, ki) {
  const kw = state.adGroups[agi].keywords[ki];
  kw.enabled = !kw.enabled;
  toast(`${kw.text}: ${kw.enabled ? 'enabled' : 'paused'}`);
  render();
}

function updateAdHeadline(agIdx, idx, val) {
  ensureAd(agIdx);
  state.adGroups[agIdx].ads[0].headlines[idx] = val;
}

function updateAdDesc(agIdx, idx, val) {
  ensureAd(agIdx);
  state.adGroups[agIdx].ads[0].descriptions[idx] = val;
}

function ensureAd(agIdx) {
  if (state.adGroups[agIdx].ads.length === 0) {
    state.adGroups[agIdx].ads.push({ headlines: Array(15).fill(''), descriptions: Array(4).fill(''), enabled: true });
  }
}

function launchCampaign() {
  state.phase = 'running';
  state.activeTab = 'overview';
  advanceWeek();
}

function advanceWeek() {
  if (state.week >= CONFIG.totalWeeks) return;
  simulateWeek();
  toast(`Week ${state.week} complete`);
  render();
}

function showScorecard() { state.phase = 'complete'; render(); }

function switchTab(tab) { state.activeTab = tab; render(); }

function addNegativeFromST(query) {
  const words = query.toLowerCase().split(/\s+/);
  const candidates = words.filter(w => w.length > 3 && !['fire','system','commercial','service','near','cost'].includes(w));
  const neg = candidates.length > 0 ? candidates[0] : words[words.length - 1];
  if (!state.negativeKeywords.includes(neg)) {
    state.negativeKeywords.push(neg);
    toast(`Added negative: "${neg}"`);
  }
  render();
}

function addNegative() {
  const text = document.getElementById('neg-text').value.trim().toLowerCase();
  if (!text) return;
  const parts = text.split(/[,;]+/).map(s => s.trim()).filter(Boolean);
  for (const p of parts) {
    if (!state.negativeKeywords.includes(p)) state.negativeKeywords.push(p);
  }
  toast(`Added ${parts.length} negative${parts.length === 1 ? '' : 's'}`);
  render();
}

function removeNegative(i) {
  state.negativeKeywords.splice(i, 1);
  render();
}

function resetSim() { initState(); render(); }

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escJs(s) { return String(s).replace(/'/g,"\\'").replace(/\\/g,'\\\\'); }
function bindEvents() {}

// ============================================================
// INIT
// ============================================================
initState();
render();
</script>
</body>
</html>
